---
# custom-installers.yml — Idempotent replacements for the shell scripts in this directory.
# Re-running at any time is safe; each tool only installs if absent.
#
# Run standalone:
#   ansible-playbook custom-installers.yml --ask-become-pass
# Invoked from ansible.yml via import_playbook.

- name: Install 3rd-party packages not in standard Ubuntu repos
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    deb_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    dnvm_arch: "{{ 'x64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    # Looking Glass: must match the client rev pinned in nix/modules/packages.nix
    # (lookingGlassClient) and the IDD installed in the Windows guest.
    looking_glass_rev: 236efcb155f952f5d7d9fcd5891a3060ad254e68
    kvmfr_version: "0.0.12"      # PACKAGE_VERSION in module/dkms.conf at that rev
    kvmfr_static_size_mb: 64     # 2256x1504 needs ~46 MiB → next power of two

  tasks:

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    # One file per tool. import_tasks is static, so --tags, --start-at-task
    # and --list-tasks behave as if the tasks were inline.
    - name: Docker
      ansible.builtin.import_tasks: ansible/installers/docker.yml
    - name: Tailscale
      ansible.builtin.import_tasks: ansible/installers/tailscale.yml
    - name: Mullvad
      ansible.builtin.import_tasks: ansible/installers/mullvad-vpn.yml
    - name: Claude Desktop
      ansible.builtin.import_tasks: ansible/installers/claude-desktop.yml
    - name: ChatGPT Desktop
      ansible.builtin.import_tasks: ansible/installers/chatgpt-desktop.yml
    - name: Android Studio
      ansible.builtin.import_tasks: ansible/installers/android-studio.yml
    - name: Mainline
      ansible.builtin.import_tasks: ansible/installers/mainline.yml
    - name: dnvm
      ansible.builtin.import_tasks: ansible/installers/dnvm.yml
    - name: Homebrew
      ansible.builtin.import_tasks: ansible/installers/homebrew.yml
    - name: hw-monitor
      ansible.builtin.import_tasks: ansible/installers/hw-monitor.yml
    - name: Cline Desktop
      ansible.builtin.import_tasks: ansible/installers/cline-desktop.yml
    - name: LibreSprite
      ansible.builtin.import_tasks: ansible/installers/libresprite.yml
    - name: fw-fanctrl
      ansible.builtin.import_tasks: ansible/installers/fw-fanctrl.yml
    - name: VSCode
      ansible.builtin.import_tasks: ansible/installers/vscode.yml
    - name: Devin Desktop
      ansible.builtin.import_tasks: ansible/installers/devin-desktop.yml
    - name: MEGAsync
      ansible.builtin.import_tasks: ansible/installers/megasync.yml
    - name: RustDesk
      ansible.builtin.import_tasks: ansible/installers/rustdesk.yml
    - name: AppMan
      ansible.builtin.import_tasks: ansible/installers/appman.yml
    - name: Chromium sandbox
      ansible.builtin.import_tasks: ansible/installers/chromium-suid-sandbox.yml
    - name: Looking Glass
      ansible.builtin.import_tasks: ansible/installers/looking-glass.yml
