---
# custom-installers.yml — Idempotent replacements for the shell scripts in this directory.
# Re-running at any time is safe; each tool only installs if absent.
#
# Run standalone:
#   ansible-playbook custom-installers.yml --ask-become-pass
# Invoked from ansible.yml via import_playbook.

- name: Install 3rd-party packages not in standard Ubuntu repos
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    deb_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    dnvm_arch: "{{ 'x64' if ansible_architecture == 'x86_64' else 'arm64' }}"

  tasks:

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    # ════════════════════════════════════════════════════════════════════════
    # DOCKER — https://docs.docker.com/engine/install/ubuntu/
    # ════════════════════════════════════════════════════════════════════════

    - name: Docker | ensure keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: yes
      when: ansible_facts.packages['docker-ce'] is not defined

    - name: Docker | download GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['docker-ce'] is not defined

    - name: Docker | add apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ deb_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['docker-ce'] is not defined

    - name: Docker | install packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      become: yes
      when: ansible_facts.packages['docker-ce'] is not defined

    # Group add runs unconditionally: idempotent, and covers cases where
    # docker was installed externally without this playbook.
    - name: Docker | add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes
      become: yes

    # ════════════════════════════════════════════════════════════════════════
    # TAILSCALE — https://tailscale.com/kb/1187/install-ubuntu-2204
    # ════════════════════════════════════════════════════════════════════════

    - name: Tailscale | download GPG keyring
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['tailscale'] is not defined

    - name: Tailscale | add apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
          https://pkgs.tailscale.com/stable/ubuntu
          {{ ansible_distribution_release }} main
        filename: tailscale
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['tailscale'] is not defined

    - name: Tailscale | install package
      ansible.builtin.apt:
        name: tailscale
        state: present
      become: yes
      when: ansible_facts.packages['tailscale'] is not defined

    # Enable unconditionally: covers tailscale installed by other means with
    # the service never started.
    - name: Tailscale | enable and start tailscaled service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: yes
        state: started
        daemon_reload: yes
      become: yes

    # ════════════════════════════════════════════════════════════════════════
    # MULLVAD VPN — https://mullvad.net/en/help/install-mullvad-app-linux#ubuntu-debian
    # ════════════════════════════════════════════════════════════════════════

    - name: Mullvad | download GPG keyring
      ansible.builtin.get_url:
        url: https://repository.mullvad.net/deb/mullvad-keyring.asc
        dest: /usr/share/keyrings/mullvad-keyring.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['mullvad-vpn'] is not defined

    - name: Mullvad | add apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/mullvad-keyring.asc arch={{ deb_arch }}]
          https://repository.mullvad.net/deb/stable
          {{ ansible_distribution_release }} main
        filename: mullvad
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['mullvad-vpn'] is not defined

    - name: Mullvad | install package
      ansible.builtin.apt:
        name: mullvad-vpn
        state: present
      become: yes
      when: ansible_facts.packages['mullvad-vpn'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # ANDROID STUDIO — ppa:maarten-fonville/android-studio
    # The Nix path (androidStudioPackages.stable via buildFHSEnv) was reverted
    # because the FHS rootfs rebuild on every lock bump dwarfed every other
    # build in the closure. ANDROID_HOME (set in shell.nix) and the existing
    # SDK in ~/Documents/Dev/Android/Sdk continue to work unchanged.
    # ════════════════════════════════════════════════════════════════════════

    - name: Android Studio | check for PPA-managed installation
      ansible.builtin.stat:
        path: /opt/android-studio
      register: android_studio_ppa

    - name: Android Studio | download PPA signing key
      ansible.builtin.get_url:
        url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB0B65046D9826D045FAFBA324EE97B1881326419&options=mr'
        dest: /etc/apt/keyrings/maarten-fonville-android-studio.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when:
        - not android_studio_ppa.stat.exists
        - ansible_facts.packages['android-studio'] is not defined

    - name: Android Studio | add PPA
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/maarten-fonville-android-studio.asc]
          https://ppa.launchpadcontent.net/maarten-fonville/android-studio/ubuntu
          {{ ansible_distribution_release }} main
        filename: maarten-fonville-ubuntu-android-studio
        state: present
        update_cache: yes
      become: yes
      when:
        - not android_studio_ppa.stat.exists
        - ansible_facts.packages['android-studio'] is not defined

    - name: Android Studio | install from PPA
      ansible.builtin.apt:
        name: android-studio
        state: present
      become: yes
      when:
        - not android_studio_ppa.stat.exists
        - ansible_facts.packages['android-studio'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # MAINLINE — Ubuntu mainline kernel installer
    # https://github.com/bkw777/mainline
    # PPA: ppa:cappelikan/ppa (upstream-recommended)
    # ════════════════════════════════════════════════════════════════════════

    - name: Mainline | download PPA signing key
      ansible.builtin.get_url:
        url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3AE27527713D2479DCAFFD58A89D7C1B2F76304D&options=mr'
        dest: /etc/apt/keyrings/cappelikan-ppa.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['mainline'] is not defined

    - name: Mainline | add PPA
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/cappelikan-ppa.asc]
          https://ppa.launchpadcontent.net/cappelikan/ppa/ubuntu
          {{ ansible_distribution_release }} main
        filename: cappelikan-ubuntu-ppa
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['mainline'] is not defined

    - name: Mainline | install from PPA
      ansible.builtin.apt:
        name: mainline
        state: present
      become: yes
      when: ansible_facts.packages['mainline'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # DNVM — .NET Version Manager — https://github.com/dn-vm/dnvm
    # selfinstall places the binary at ~/.local/share/dnvm/dnvm.
    # No root needed — installs to user home.
    # ════════════════════════════════════════════════════════════════════════

    - name: dnvm | check if already installed
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/share/dnvm/dnvm"
      register: dnvm_binary

    - name: dnvm | fetch latest release metadata from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/dn-vm/dnvm/releases/latest
        return_content: yes
      register: dnvm_release
      when: not dnvm_binary.stat.exists

    - name: dnvm | resolve architecture-specific download URL
      ansible.builtin.set_fact:
        dnvm_download_url: >-
          {{ dnvm_release.json.assets
             | selectattr('name', 'search', 'linux-' + dnvm_arch + '\\.tar\\.gz$')
             | rejectattr('name', 'search', '\\.sig$')
             | map(attribute='browser_download_url')
             | first }}
      when: not dnvm_binary.stat.exists

    - name: dnvm | download release archive
      ansible.builtin.get_url:
        url: "{{ dnvm_download_url }}"
        dest: /tmp/dnvm-latest.tar.gz
        mode: '0644'
      when: not dnvm_binary.stat.exists

    - name: dnvm | create temp extraction directory
      ansible.builtin.file:
        path: /tmp/dnvm-extract
        state: directory
        mode: '0755'
      when: not dnvm_binary.stat.exists

    - name: dnvm | extract archive
      ansible.builtin.unarchive:
        src: /tmp/dnvm-latest.tar.gz
        dest: /tmp/dnvm-extract
        remote_src: yes
      when: not dnvm_binary.stat.exists

    - name: dnvm | run selfinstall
      ansible.builtin.command:
        cmd: /tmp/dnvm-extract/dnvm selfinstall
      when: not dnvm_binary.stat.exists

    - name: dnvm | clean up temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/dnvm-latest.tar.gz
        - /tmp/dnvm-extract
      when: not dnvm_binary.stat.exists

    # ════════════════════════════════════════════════════════════════════════
    # HOMEBREW — https://brew.sh/
    # Shell integration (eval "$(brew shellenv)") is in nix/modules/shell.nix.
    # No root needed — installs to /home/linuxbrew as current user.
    # ════════════════════════════════════════════════════════════════════════

    - name: Homebrew | check if already installed
      ansible.builtin.stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: brew_binary

    # NONINTERACTIVE=1 suppresses all install prompts.
    - name: Homebrew | run official installer
      ansible.builtin.shell:
        cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        creates: /home/linuxbrew/.linuxbrew/bin/brew
      environment:
        NONINTERACTIVE: "1"
      when: not brew_binary.stat.exists

    # playbook_dir = installs/; Brewfile is in the same directory.
    - name: Homebrew | check if Brewfile exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/Brewfile"
      register: brewfile

    - name: Homebrew | install packages from Brewfile
      ansible.builtin.command:
        cmd: "/home/linuxbrew/.linuxbrew/bin/brew bundle install --file={{ playbook_dir }}/Brewfile"
      when: brewfile.stat.exists
      changed_when: false

    # ════════════════════════════════════════════════════════════════════════
    # AWATCHER — https://github.com/2e3s/awatcher
    # ActivityWatch-compatible window + idle watcher distributed as .deb.
    # ════════════════════════════════════════════════════════════════════════

    - name: awatcher | fetch latest release metadata from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/2e3s/awatcher/releases/latest
        return_content: yes
      register: awatcher_release
      when: ansible_facts.packages['awatcher'] is not defined

    # '^awatcher_' anchor excludes the 'aw-awatcher' bundle .deb without a rejectattr.
    - name: awatcher | resolve .deb download URL
      ansible.builtin.set_fact:
        awatcher_download_url: >-
          {{ awatcher_release.json.assets
             | selectattr('name', 'search', '^awatcher_.*_amd64\\.deb$')
             | map(attribute='browser_download_url')
             | first }}
      when: ansible_facts.packages['awatcher'] is not defined

    - name: awatcher | download .deb package
      ansible.builtin.get_url:
        url: "{{ awatcher_download_url }}"
        dest: /tmp/awatcher.deb
        mode: '0644'
      when: ansible_facts.packages['awatcher'] is not defined

    - name: awatcher | install .deb
      ansible.builtin.apt:
        deb: /tmp/awatcher.deb
      become: yes
      when: ansible_facts.packages['awatcher'] is not defined

    - name: awatcher | clean up temp .deb
      ansible.builtin.file:
        path: /tmp/awatcher.deb
        state: absent
      when: ansible_facts.packages['awatcher'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # FW-FANCTRL — https://github.com/TamtamHero/fw-fanctrl
    # Framework Laptop fan controller. Upstream install.sh bundles ectool, the
    # systemd service, and the system-sleep hook — none of which the nixpkgs
    # package ships. Idempotent: skipped if /usr/bin/fw-fanctrl already exists.
    # ════════════════════════════════════════════════════════════════════════

    - name: fw-fanctrl | check if already installed
      ansible.builtin.stat:
        path: /usr/bin/fw-fanctrl
      register: fw_fanctrl_bin

    - name: fw-fanctrl | install build/runtime prerequisites
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-jsonschema
          - libnotify-bin
        state: present
      become: yes
      when: not fw_fanctrl_bin.stat.exists

    - name: fw-fanctrl | clone repository
      ansible.builtin.git:
        repo: https://github.com/TamtamHero/fw-fanctrl.git
        dest: /tmp/fw-fanctrl
        version: v1.0.4
        depth: 1
        force: yes
      when: not fw_fanctrl_bin.stat.exists

    - name: fw-fanctrl | run upstream install.sh
      ansible.builtin.command:
        cmd: ./install.sh --no-sudo
        chdir: /tmp/fw-fanctrl
      become: yes
      when: not fw_fanctrl_bin.stat.exists

    - name: fw-fanctrl | clean up clone
      ansible.builtin.file:
        path: /tmp/fw-fanctrl
        state: absent
      when: not fw_fanctrl_bin.stat.exists

    # ════════════════════════════════════════════════════════════════════════
    # VSCODE — https://code.visualstudio.com/docs/setup/linux
    # Replaces programs.vscode in nix/modules/programs.nix. The Nix repackaging
    # rebuilt on every lock bump, and ms-vscode.cpptools / ms-python.vscode-pylance
    # are MS-licensed for *official* VSCode only — apt is the right channel.
    # Settings & keybindings are still managed declaratively (xdg.configFile).
    # Extensions are installed via the in-app marketplace.
    # ════════════════════════════════════════════════════════════════════════

    - name: VSCode | download Microsoft GPG key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /usr/share/keyrings/microsoft.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['code'] is not defined

    - name: VSCode | add apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ deb_arch }} signed-by=/usr/share/keyrings/microsoft.asc]
          https://packages.microsoft.com/repos/code stable main
        filename: vscode
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['code'] is not defined

    - name: VSCode | install package
      ansible.builtin.apt:
        name: code
        state: present
      become: yes
      when: ansible_facts.packages['code'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # CURSOR — https://cursor.com/
    # AI-powered code editor (formerly via Nix's code-cursor). Distributed as
    # an AppImage; downloaded once to ~/.local/bin and exposed with a desktop
    # entry. Updates: re-run with cursor_force_update=true, or replace the
    # binary manually.
    # ════════════════════════════════════════════════════════════════════════

    - name: Cursor | check if AppImage already present
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/bin/cursor.AppImage"
      register: cursor_bin

    - name: Cursor | resolve latest stable AppImage URL
      ansible.builtin.uri:
        url: https://www.cursor.com/api/download?platform=linux-x64&releaseTrack=stable
        return_content: yes
        headers:
          User-Agent: Mozilla/5.0
      register: cursor_release
      when: not cursor_bin.stat.exists or cursor_force_update | default(false) | bool

    - name: Cursor | ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: '0755'
      when: not cursor_bin.stat.exists or cursor_force_update | default(false) | bool

    - name: Cursor | download AppImage
      ansible.builtin.get_url:
        url: "{{ cursor_release.json.downloadUrl }}"
        dest: "{{ ansible_env.HOME }}/.local/bin/cursor.AppImage"
        mode: '0755'
      when: not cursor_bin.stat.exists or cursor_force_update | default(false) | bool

    - name: Cursor | install desktop entry
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.local/share/applications/cursor.desktop"
        mode: '0644'
        content: |
          [Desktop Entry]
          Name=Cursor
          Exec={{ ansible_env.HOME }}/.local/bin/cursor.AppImage --no-sandbox %F
          Terminal=false
          Type=Application
          Icon=cursor
          Categories=Development;IDE;
          MimeType=text/plain;inode/directory;
          StartupWMClass=Cursor

    # ════════════════════════════════════════════════════════════════════════
    # CLAUDE DESKTOP — https://github.com/aaddrick/claude-desktop-debian
    # Replaces the aaddrick claude-desktop flake input which rebuilt the .deb
    # on every lock bump. Now installs the upstream prebuilt .deb directly.
    # ════════════════════════════════════════════════════════════════════════

    - name: Claude Desktop | fetch latest release metadata
      ansible.builtin.uri:
        url: https://api.github.com/repos/aaddrick/claude-desktop-debian/releases/latest
        return_content: yes
      register: claude_desktop_release
      when: ansible_facts.packages['claude-desktop'] is not defined

    - name: Claude Desktop | resolve .deb download URL
      ansible.builtin.set_fact:
        claude_desktop_url: "{{ claude_desktop_release.json.assets | selectattr('name', 'search', '_' + deb_arch + '\\.deb$') | map(attribute='browser_download_url') | first }}"
      when: ansible_facts.packages['claude-desktop'] is not defined

    - name: Claude Desktop | download .deb
      ansible.builtin.get_url:
        url: "{{ claude_desktop_url }}"
        dest: /tmp/claude-desktop.deb
        mode: '0644'
      when: ansible_facts.packages['claude-desktop'] is not defined

    - name: Claude Desktop | install .deb
      ansible.builtin.apt:
        deb: /tmp/claude-desktop.deb
      become: yes
      when: ansible_facts.packages['claude-desktop'] is not defined

    - name: Claude Desktop | clean up temp .deb
      ansible.builtin.file:
        path: /tmp/claude-desktop.deb
        state: absent
      when: ansible_facts.packages['claude-desktop'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # MEGASYNC — https://help.mega.io/installs-apps/desktop/repository
    # MEGA Cloud Drive sync client. nixpkgs builds it from source — official
    # apt repo provides a prebuilt .deb that tracks releases automatically.
    # ════════════════════════════════════════════════════════════════════════

    - name: MEGAsync | download Meganz GPG key
      ansible.builtin.get_url:
        url: https://mega.nz/linux/repo/Debian_12/Release.key
        dest: /usr/share/keyrings/meganz.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['megasync'] is not defined

    - name: MEGAsync | add apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ deb_arch }} signed-by=/usr/share/keyrings/meganz.asc]
          https://mega.nz/linux/repo/xUbuntu_{{ ansible_distribution_version }}/ ./
        filename: megasync
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['megasync'] is not defined

    - name: MEGAsync | install package
      ansible.builtin.apt:
        name: megasync
        state: present
      become: yes
      when: ansible_facts.packages['megasync'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # RUSTDESK — https://github.com/rustdesk/rustdesk/releases
    # Open-source remote desktop. nixpkgs builds it from source (Rust + the
    # vendored libsciter crate); the upstream .deb is prebuilt.
    # ════════════════════════════════════════════════════════════════════════

    - name: RustDesk | fetch latest release metadata
      ansible.builtin.uri:
        url: https://api.github.com/repos/rustdesk/rustdesk/releases/latest
        return_content: yes
      register: rustdesk_release
      when: ansible_facts.packages['rustdesk'] is not defined

    - name: RustDesk | resolve .deb download URL
      ansible.builtin.set_fact:
        rustdesk_url: >-
          {{ rustdesk_release.json.assets
             | selectattr('name', 'search', '-x86_64\\.deb$')
             | map(attribute='browser_download_url')
             | first }}
      when: ansible_facts.packages['rustdesk'] is not defined

    - name: RustDesk | download .deb
      ansible.builtin.get_url:
        url: "{{ rustdesk_url }}"
        dest: /tmp/rustdesk.deb
        mode: '0644'
      when: ansible_facts.packages['rustdesk'] is not defined

    - name: RustDesk | install .deb
      ansible.builtin.apt:
        deb: /tmp/rustdesk.deb
      become: yes
      when: ansible_facts.packages['rustdesk'] is not defined

    - name: RustDesk | clean up temp .deb
      ansible.builtin.file:
        path: /tmp/rustdesk.deb
        state: absent
      when: ansible_facts.packages['rustdesk'] is not defined
