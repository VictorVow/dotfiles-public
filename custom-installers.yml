---
# custom-installers.yml — Idempotent replacements for the shell scripts in this directory.
# Re-running at any time is safe; each tool only installs if absent.
#
# Run standalone:
#   ansible-playbook custom-installers.yml --ask-become-pass
# Invoked from ansible.yml via import_playbook.

- name: Install 3rd-party packages not in standard Ubuntu repos
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    deb_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    dnvm_arch: "{{ 'x64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    # Looking Glass: must match the client rev pinned in nix/modules/packages.nix
    # (lookingGlassClient) and the IDD installed in the Windows guest.
    looking_glass_rev: 236efcb155f952f5d7d9fcd5891a3060ad254e68
    kvmfr_version: "0.0.12"      # PACKAGE_VERSION in module/dkms.conf at that rev
    kvmfr_static_size_mb: 64     # 2256x1504 needs ~46 MiB → next power of two

  tasks:

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    # ════════════════════════════════════════════════════════════════════════
    # DOCKER — https://docs.docker.com/engine/install/ubuntu/
    # ════════════════════════════════════════════════════════════════════════

    - name: Docker | ensure keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: yes
      when: ansible_facts.packages['docker-ce'] is not defined

    - name: Docker | download GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['docker-ce'] is not defined

    - name: Docker | add apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ deb_arch }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
      become: yes
      when: ansible_facts.packages['docker-ce'] is not defined

    - name: Docker | install packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['docker-ce'] is not defined

    # Group add runs unconditionally: idempotent, and covers cases where
    # docker was installed externally without this playbook.
    - name: Docker | add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: docker
        append: yes
      become: yes

    # ════════════════════════════════════════════════════════════════════════
    # TAILSCALE — https://tailscale.com/kb/1187/install-ubuntu-2204
    # ════════════════════════════════════════════════════════════════════════

    - name: Tailscale | download GPG keyring
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['tailscale'] is not defined

    - name: Tailscale | add apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: https://pkgs.tailscale.com/stable/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present
      become: yes
      when: ansible_facts.packages['tailscale'] is not defined

    - name: Tailscale | install package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['tailscale'] is not defined

    # Enable unconditionally: covers tailscale installed by other means with
    # the service never started.
    - name: Tailscale | enable and start tailscaled service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: yes
        state: started
        daemon_reload: yes
      become: yes

    # ════════════════════════════════════════════════════════════════════════
    # MULLVAD VPN — https://mullvad.net/en/help/install-mullvad-app-linux#ubuntu-debian
    # ════════════════════════════════════════════════════════════════════════

    - name: Mullvad | download GPG keyring
      ansible.builtin.get_url:
        url: https://repository.mullvad.net/deb/mullvad-keyring.asc
        dest: /usr/share/keyrings/mullvad-keyring.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['mullvad-vpn'] is not defined

    - name: Mullvad | add apt repository
      ansible.builtin.deb822_repository:
        name: mullvad
        types: deb
        uris: https://repository.mullvad.net/deb/stable
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        architectures: "{{ deb_arch }}"
        signed_by: /usr/share/keyrings/mullvad-keyring.asc
        state: present
      become: yes
      when: ansible_facts.packages['mullvad-vpn'] is not defined

    - name: Mullvad | install package
      ansible.builtin.apt:
        name: mullvad-vpn
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['mullvad-vpn'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # CLAUDE DESKTOP — https://code.claude.com/docs/en/desktop-linux
    # Official Anthropic apt repository (Linux beta). Replaces the unofficial
    # aaddrick AppImage that was previously managed via AppMan
    # (appman-appimages.txt). Updates arrive through normal apt upgrades.
    # ════════════════════════════════════════════════════════════════════════

    - name: Claude Desktop | download Anthropic signing key
      ansible.builtin.get_url:
        url: https://downloads.claude.ai/claude-desktop/key.asc
        dest: /usr/share/keyrings/claude-desktop-archive-keyring.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['claude-desktop'] is not defined

    - name: Claude Desktop | add apt repository
      ansible.builtin.deb822_repository:
        name: claude-desktop
        types: deb
        uris: https://downloads.claude.ai/claude-desktop/apt/stable
        suites: "stable"
        components: main
        architectures: "{{ deb_arch }}"
        signed_by: /usr/share/keyrings/claude-desktop-archive-keyring.asc
        state: present
      become: yes
      when: ansible_facts.packages['claude-desktop'] is not defined

    - name: Claude Desktop | install package
      ansible.builtin.apt:
        name: claude-desktop
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['claude-desktop'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # CHATGPT DESKTOP — https://learn.chatgpt.com/docs/linux/linux-app
    # Official OpenAI .deb. Installing it configures a signed OpenAI apt
    # repository, so later updates arrive through normal apt upgrades.
    # ════════════════════════════════════════════════════════════════════════

    - name: ChatGPT Desktop | download .deb package
      ansible.builtin.get_url:
        url: "https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_{{ deb_arch }}.deb"
        dest: /tmp/chatgpt.deb
        mode: '0644'
      when: ansible_facts.packages['chatgpt'] is not defined

    # apt-get rather than the apt module's `deb:` — python-apt's .deb check
    # can't resolve versioned virtual Provides, so the t64 rename
    # (libglib2.0-0t64 Provides libglib2.0-0) reads as unsatisfiable.
    - name: ChatGPT Desktop | install .deb
      ansible.builtin.command: apt-get install -y /tmp/chatgpt.deb
      become: yes
      when: ansible_facts.packages['chatgpt'] is not defined

    - name: ChatGPT Desktop | clean up temp .deb
      ansible.builtin.file:
        path: /tmp/chatgpt.deb
        state: absent
      when: ansible_facts.packages['chatgpt'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # ANDROID STUDIO — ppa:maarten-fonville/android-studio
    # The Nix path (androidStudioPackages.stable via buildFHSEnv) was reverted
    # because the FHS rootfs rebuild on every lock bump dwarfed every other
    # build in the closure. ANDROID_HOME (set in shell.nix) and the existing
    # SDK in ~/Projects/Dev/Android/Sdk continue to work unchanged.
    # ════════════════════════════════════════════════════════════════════════

    - name: Android Studio | check for PPA-managed installation
      ansible.builtin.stat:
        path: /opt/android-studio
      register: android_studio_ppa

    - name: Android Studio | download PPA signing key
      ansible.builtin.get_url:
        url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB0B65046D9826D045FAFBA324EE97B1881326419&options=mr'
        dest: /etc/apt/keyrings/maarten-fonville-android-studio.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when:
        - not android_studio_ppa.stat.exists
        - ansible_facts.packages['android-studio'] is not defined

    - name: Android Studio | add PPA
      ansible.builtin.deb822_repository:
        name: maarten-fonville-ubuntu-android-studio
        types: deb
        uris: https://ppa.launchpadcontent.net/maarten-fonville/android-studio/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: /etc/apt/keyrings/maarten-fonville-android-studio.asc
        state: present
      become: yes
      when:
        - not android_studio_ppa.stat.exists
        - ansible_facts.packages['android-studio'] is not defined

    - name: Android Studio | install from PPA
      ansible.builtin.apt:
        name: android-studio
        state: present
        update_cache: yes
      become: yes
      when:
        - not android_studio_ppa.stat.exists
        - ansible_facts.packages['android-studio'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # MAINLINE — Ubuntu mainline kernel installer
    # https://github.com/bkw777/mainline
    # PPA: ppa:cappelikan/ppa (upstream-recommended)
    # ════════════════════════════════════════════════════════════════════════

    - name: Mainline | download PPA signing key
      ansible.builtin.get_url:
        url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3AE27527713D2479DCAFFD58A89D7C1B2F76304D&options=mr'
        dest: /etc/apt/keyrings/cappelikan-ppa.asc
        mode: '0644'
        owner: root
        group: root
      become: yes
      when: ansible_facts.packages['mainline'] is not defined

    - name: Mainline | add PPA
      ansible.builtin.deb822_repository:
        name: cappelikan-ubuntu-ppa
        types: deb
        uris: https://ppa.launchpadcontent.net/cappelikan/ppa/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: /etc/apt/keyrings/cappelikan-ppa.asc
        state: present
      become: yes
      when: ansible_facts.packages['mainline'] is not defined

    - name: Mainline | install from PPA
      ansible.builtin.apt:
        name: mainline
        state: present
        update_cache: yes
      become: yes
      when: ansible_facts.packages['mainline'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # DNVM — .NET Version Manager — https://github.com/dn-vm/dnvm
    # selfinstall places the binary at ~/.local/share/dnvm/dnvm.
    # No root needed — installs to user home.
    # ════════════════════════════════════════════════════════════════════════

    - name: dnvm | check if already installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/dnvm/dnvm"
      register: dnvm_binary

    - name: dnvm | fetch latest release metadata from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/dn-vm/dnvm/releases/latest
        return_content: yes
      register: dnvm_release
      when: not dnvm_binary.stat.exists

    - name: dnvm | resolve architecture-specific download URL
      ansible.builtin.set_fact:
        dnvm_download_url: >-
          {{ dnvm_release.json.assets
             | selectattr('name', 'search', 'linux-' + dnvm_arch + '\.tar\.gz$')
             | rejectattr('name', 'search', '\.sig$')
             | map(attribute='browser_download_url')
             | first }}
      when: not dnvm_binary.stat.exists

    - name: dnvm | download release archive
      ansible.builtin.get_url:
        url: "{{ dnvm_download_url }}"
        dest: /tmp/dnvm-latest.tar.gz
        mode: '0644'
      when: not dnvm_binary.stat.exists

    - name: dnvm | create temp extraction directory
      ansible.builtin.file:
        path: /tmp/dnvm-extract
        state: directory
        mode: '0755'
      when: not dnvm_binary.stat.exists

    - name: dnvm | extract archive
      ansible.builtin.unarchive:
        src: /tmp/dnvm-latest.tar.gz
        dest: /tmp/dnvm-extract
        remote_src: yes
      when: not dnvm_binary.stat.exists

    - name: dnvm | run selfinstall
      ansible.builtin.command:
        cmd: /tmp/dnvm-extract/dnvm selfinstall
      when: not dnvm_binary.stat.exists

    - name: dnvm | clean up temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/dnvm-latest.tar.gz
        - /tmp/dnvm-extract
      when: not dnvm_binary.stat.exists

    # ════════════════════════════════════════════════════════════════════════
    # HOMEBREW — https://brew.sh/
    # Shell integration (eval "$(brew shellenv)") is in nix/modules/shell.nix.
    # No root needed — installs to /home/linuxbrew as current user.
    # ════════════════════════════════════════════════════════════════════════

    - name: Homebrew | check if already installed
      ansible.builtin.stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: brew_binary

    # NONINTERACTIVE=1 suppresses all install prompts.
    - name: Homebrew | run official installer
      ansible.builtin.shell:
        cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        creates: /home/linuxbrew/.linuxbrew/bin/brew
      environment:
        NONINTERACTIVE: "1"
      when: not brew_binary.stat.exists

    # playbook_dir = installs/; Brewfile is in the same directory.
    - name: Homebrew | check if Brewfile exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/Brewfile"
      register: brewfile

    - name: Homebrew | install packages from Brewfile
      ansible.builtin.command:
        cmd: "/home/linuxbrew/.linuxbrew/bin/brew bundle install --file={{ playbook_dir }}/Brewfile"
      when: brewfile.stat.exists
      changed_when: false

    # ════════════════════════════════════════════════════════════════════════
    # HW-MONITOR — https://github.com/husseinhareb/hw-monitor
    # Tauri system monitor distributed as .deb (links against system WebKit).
    # ════════════════════════════════════════════════════════════════════════

    - name: hw-monitor | fetch latest release metadata from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/husseinhareb/hw-monitor/releases/latest
        return_content: yes
      register: hw_monitor_release
      when: ansible_facts.packages['hw-monitor'] is not defined

    - name: hw-monitor | resolve .deb download URL
      ansible.builtin.set_fact:
        hw_monitor_download_url: >-
          {{ hw_monitor_release.json.assets
             | selectattr('name', 'search', '_' ~ deb_arch ~ '\.deb$')
             | map(attribute='browser_download_url')
             | first }}
      when: ansible_facts.packages['hw-monitor'] is not defined

    - name: hw-monitor | download .deb package
      ansible.builtin.get_url:
        url: "{{ hw_monitor_download_url }}"
        dest: /tmp/hw-monitor.deb
        mode: '0644'
      when: ansible_facts.packages['hw-monitor'] is not defined

    - name: hw-monitor | install .deb
      ansible.builtin.apt:
        deb: /tmp/hw-monitor.deb
      become: yes
      when: ansible_facts.packages['hw-monitor'] is not defined

    - name: hw-monitor | clean up temp .deb
      ansible.builtin.file:
        path: /tmp/hw-monitor.deb
        state: absent
      when: ansible_facts.packages['hw-monitor'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # CLINE DESKTOP — https://github.com/cline/cline/releases
    # Desktop app .deb (package name `cline`). The repo mixes releases for the
    # CLI, SDK and VS Code extension, so /releases/latest is unreliable; pick the
    # newest non-prerelease tagged `desktop-v*` instead. Install-if-absent only.
    # ════════════════════════════════════════════════════════════════════════

    - name: Cline Desktop | fetch release list from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/cline/cline/releases?per_page=100
        return_content: yes
      register: cline_releases
      when: ansible_facts.packages['cline'] is not defined

    - name: Cline Desktop | resolve .deb download URL
      ansible.builtin.set_fact:
        cline_download_url: >-
          {{ (cline_releases.json
              | selectattr('tag_name', 'match', '^desktop-v')
              | rejectattr('prerelease')
              | rejectattr('draft')
              | first).assets
             | selectattr('name', 'search', '_' ~ deb_arch ~ '\.deb$')
             | map(attribute='browser_download_url')
             | first }}
      when: ansible_facts.packages['cline'] is not defined

    - name: Cline Desktop | download .deb package
      ansible.builtin.get_url:
        url: "{{ cline_download_url }}"
        dest: /tmp/cline.deb
        mode: '0644'
      when: ansible_facts.packages['cline'] is not defined

    - name: Cline Desktop | install .deb
      ansible.builtin.apt:
        deb: /tmp/cline.deb
      become: yes
      when: ansible_facts.packages['cline'] is not defined

    - name: Cline Desktop | clean up temp .deb
      ansible.builtin.file:
        path: /tmp/cline.deb
        state: absent
      when: ansible_facts.packages['cline'] is not defined

    # ════════════════════════════════════════════════════════════════════════
    # LIBRESPRITE —https://github.com/LibreSprite/LibreSprite
    # FOSS (MIT) fork of Aseprite. Replaces pkgs.aseprite: nixpkgs' aseprite
    # builds Aseprite's source-available tree from scratch on every lock bump
    # (slow, and the prebuilt binary upstream sells is paid). LibreSprite ships
    # a prebuilt AppImage from GitHub Releases, zipped as a single asset.
    # Not in AM's (AppMan) catalogue, so this bypasses appman-appimages.txt and
    # installs straight to ~/AppImages, matching that directory's convention
    # for standalone AppImages (see docs/system/declarative-vs-imperative-state.md).
    # Menu entry: a plain .desktop file in ~/.local/share/applications, icon
    # extracted from the AppImage into the hicolor theme (tasks below).
    # ════════════════════════════════════════════════════════════════════════

    - name: LibreSprite | check if already installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/AppImages/libresprite.appimage"
      register: libresprite_binary

    - name: LibreSprite | fetch latest release metadata from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/LibreSprite/LibreSprite/releases/latest
        return_content: yes
      register: libresprite_release
      when: not libresprite_binary.stat.exists

    - name: LibreSprite | resolve Linux AppImage zip download URL
      ansible.builtin.set_fact:
        libresprite_download_url: >-
          {{ libresprite_release.json.assets
             | selectattr('name', 'search', 'linux-x86_64\.zip$')
             | map(attribute='browser_download_url')
             | first }}
      when: not libresprite_binary.stat.exists

    - name: LibreSprite | download release zip
      ansible.builtin.get_url:
        url: "{{ libresprite_download_url }}"
        dest: /tmp/libresprite.zip
        mode: '0644'
      when: not libresprite_binary.stat.exists

    - name: LibreSprite | extract AppImage from zip
      ansible.builtin.unarchive:
        src: /tmp/libresprite.zip
        dest: /tmp
        remote_src: yes
      when: not libresprite_binary.stat.exists

    - name: LibreSprite | ensure ~/AppImages exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/AppImages"
        state: directory
        mode: '0755'
      when: not libresprite_binary.stat.exists

    - name: LibreSprite | install AppImage
      ansible.builtin.copy:
        src: /tmp/LibreSprite-x86_64.AppImage
        dest: "{{ ansible_facts['env']['HOME'] }}/AppImages/libresprite.appimage"
        mode: '0755'
        remote_src: yes
      when: not libresprite_binary.stat.exists

    - name: LibreSprite | clean up temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/libresprite.zip
        - /tmp/LibreSprite-x86_64.AppImage
      when: not libresprite_binary.stat.exists

    - name: LibreSprite | check if icon already installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/icons/hicolor/256x256/apps/libresprite.png"
      register: libresprite_icon

    - name: LibreSprite | extract icon from AppImage
      ansible.builtin.command:
        cmd: "{{ ansible_facts['env']['HOME'] }}/AppImages/libresprite.appimage --appimage-extract libresprite.png"
        chdir: /tmp
      when: not libresprite_icon.stat.exists

    - name: LibreSprite | install icon into hicolor theme
      ansible.builtin.copy:
        src: /tmp/squashfs-root/libresprite.png
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/icons/hicolor/256x256/apps/libresprite.png"
        mode: '0644'
      when: not libresprite_icon.stat.exists

    - name: LibreSprite | clean up extracted icon
      ansible.builtin.file:
        path: /tmp/squashfs-root
        state: absent
      when: not libresprite_icon.stat.exists

    - name: LibreSprite | install .desktop menu entry
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/org.libresprite.LibreSprite.desktop"
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=LibreSprite
          GenericName=Sprite Editor
          Comment=Animated sprite editor & pixel art tool
          Exec={{ ansible_facts['env']['HOME'] }}/AppImages/libresprite.appimage %F
          Icon=libresprite
          Terminal=false
          StartupWMClass=libresprite
          Categories=Graphics;2DGraphics;RasterGraphics;
          MimeType=image/x-aseprite;

    # ════════════════════════════════════════════════════════════════════════
    # FW-FANCTRL — https://github.com/TamtamHero/fw-fanctrl
    # Framework Laptop fan controller. Upstream install.sh bundles ectool, the
    # systemd service, and the system-sleep hook — none of which the nixpkgs
    # package ships. Idempotent: skipped if /usr/bin/fw-fanctrl already exists.
    # ════════════════════════════════════════════════════════════════════════

    - name: fw-fanctrl | check if already installed
      ansible.builtin.stat:
        path: /usr/bin/fw-fanctrl
      register: fw_fanctrl_bin

    - name: fw-fanctrl | install build/runtime prerequisites
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-build
          - python3-jsonschema
          - libnotify-bin
        state: present
      become: yes
      when: not fw_fanctrl_bin.stat.exists

    - name: fw-fanctrl | clone repository
      ansible.builtin.git:
        repo: https://github.com/TamtamHero/fw-fanctrl.git
        dest: /tmp/fw-fanctrl
        version: v1.0.4
        depth: 1
        force: yes
      when: not fw_fanctrl_bin.stat.exists

    - name: fw-fanctrl | run upstream install.sh
      ansible.builtin.command:
        cmd: ./install.sh --no-sudo
        chdir: /tmp/fw-fanctrl
      become: yes
      when: not fw_fanctrl_bin.stat.exists

    - name: fw-fanctrl | clean up clone
      ansible.builtin.file:
        path: /tmp/fw-fanctrl
        state: absent
      when: not fw_fanctrl_bin.stat.exists

    # ════════════════════════════════════════════════════════════════════════
    # VSCODE — https://code.visualstudio.com/docs/setup/linux
    # Replaces programs.vscode in nix/modules/programs.nix. The Nix repackaging
