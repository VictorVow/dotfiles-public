    # ════════════════════════════════════════════════════════════════════════
    # RUSTDESK — https://github.com/rustdesk/rustdesk/releases
    # Open-source remote desktop. nixpkgs builds it from source (Rust + the
    # vendored libsciter crate); the upstream .deb is prebuilt.
    # It IS available via AppMan but that recipe ships only the AppImage +
    # launcher + AM-updater — no systemd unit. This machine runs the system
    # service `rustdesk.service` (root, /usr/bin/rustdesk --service) for
    # unattended access, so we stay on the .deb, which owns that unit.
    # Updates: compare the latest GitHub release tag against the installed
    # dpkg version and re-install the .deb when it's newer. Reinstalling over
    # the running service is safe — dpkg swaps the binary and restarts it.
    # ════════════════════════════════════════════════════════════════════════

    - name: RustDesk | fetch latest release metadata
      ansible.builtin.uri:
        url: https://api.github.com/repos/rustdesk/rustdesk/releases/latest
        return_content: yes
      register: rustdesk_release

    - name: RustDesk | resolve latest version and .deb download URL
      ansible.builtin.set_fact:
        rustdesk_latest: "{{ rustdesk_release.json.tag_name }}"
        rustdesk_installed: "{{ ansible_facts.packages['rustdesk'][0].version | default('0') }}"
        rustdesk_url: >-
          {{ rustdesk_release.json.assets
             | selectattr('name', 'search', '-x86_64\.deb$')
             | map(attribute='browser_download_url')
             | first }}

    # Install when absent, or upgrade when the installed version is older than
    # the latest release. Never downgrades (guards against a transient/nightly
    # tag reading as "newer" only when it genuinely compares higher).
    - name: RustDesk | decide whether an install/upgrade is needed
      ansible.builtin.set_fact:
        rustdesk_needs_install: >-
          {{ ansible_facts.packages['rustdesk'] is not defined
             or rustdesk_installed is version(rustdesk_latest, '<') }}

    - name: RustDesk | report version status
      ansible.builtin.debug:
        msg: >-
          installed={{ rustdesk_installed }} latest={{ rustdesk_latest }}
          -> {{ 'installing/upgrading' if rustdesk_needs_install else 'up to date' }}

    - name: RustDesk | download .deb
      ansible.builtin.get_url:
        url: "{{ rustdesk_url }}"
        dest: /tmp/rustdesk.deb
        mode: '0644'
      when: rustdesk_needs_install

    - name: RustDesk | install .deb
      ansible.builtin.apt:
        deb: /tmp/rustdesk.deb
      become: yes
      when: rustdesk_needs_install

    - name: RustDesk | clean up temp .deb
      ansible.builtin.file:
        path: /tmp/rustdesk.deb
        state: absent
      when: rustdesk_needs_install

    # ════════════════════════════════════════════════════════════════════════
    # APPMAN (AM) — https://github.com/ivan-hc/AM
    # User-mode AppImage manager. Installs to ~/.local; no sudo needed.
    # Auto-updates of managed AppImages are driven by `appman -u` from update.sh.
    # ════════════════════════════════════════════════════════════════════════

    - name: AppMan | check if appman is already installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/appman"
      register: appman_bin

    - name: AppMan | download AM-INSTALLER
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ivan-hc/AM/main/AM-INSTALLER
        dest: /tmp/AM-INSTALLER
        mode: '0755'
        force: yes
      when: not appman_bin.stat.exists

    - name: AppMan | run installer in user mode (menu option 2 = appman)
      ansible.builtin.shell: |
        echo 2 | /tmp/AM-INSTALLER
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/appman"
      when: not appman_bin.stat.exists

    - name: AppMan | remove installer
      ansible.builtin.file:
        path: /tmp/AM-INSTALLER
        state: absent

    # ── AppMan install directory ───────────────────────────────────────────
    # AppMan defaults to ~/Applications. We redirect it to ~/AppImages/AppMan
    # to keep AppImage payloads grouped under a single ~/AppImages root.
    # Note: this only affects *future* installs — apps already extracted under
    # ~/Applications stay there until manually migrated (`appman -R <app>` then
    # reinstall, or move the directory and recreate the ~/.local/bin symlink
    # plus the .desktop file's Exec/Icon paths).

    - name: AppMan | ensure install directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/AppImages/AppMan"
        state: directory
        mode: '0755'

    - name: AppMan | configure install directory
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/appman/appman-config"
        content: "{{ ansible_facts['env']['HOME'] }}/AppImages/AppMan\n"
        mode: '0644'

    # ── Declarative AppImage sync ──────────────────────────────────────────
    # appman-appimages.txt is the canonical list. Anything listed there but not yet
    # installed gets installed; existing apps are left alone. Removal is
    # intentionally NOT automated — see docs/system/appman.md.

    - name: AppMan | read declared AppImage list
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/appman-appimages.txt"
      register: appimages_raw

    - name: AppMan | parse list (skip blanks + comments)
      ansible.builtin.set_fact:
        appimages_declared: >-
          {{ (appimages_raw.content | b64decode).splitlines()
             | map('trim')
             | reject('match', '^(#|$)')
             | list }}

    - name: AppMan | list currently installed AppImages
      ansible.builtin.command: appman -f
      register: appman_installed
      changed_when: false
      failed_when: false

    - name: AppMan | install missing AppImages from appman-appimages.txt
      ansible.builtin.command: "appman -i {{ item }}"
      environment:
        NO_COLOR: "1"
      loop: "{{ appimages_declared }}"
      when: item not in appman_installed.stdout

    # ── AppArmor userns profile for AppImages ──────────────────────────────
    #
    # WHY THIS EXISTS
    # ---------------
    # Ubuntu 23.10+ (and by extension 24.04+) ships with
    #   kernel.apparmor_restrict_unprivileged_userns=1
    # which blocks unprivileged processes from creating user namespaces
    # unless a matching AppArmor profile grants the `userns` capability.
    # User namespaces are how modern sandboxes isolate themselves —
    # Chrome/Chromium, Firefox, Electron, Flatpak/bwrap, and the internal
    # sandboxes inside many AppImages all rely on them. Without the
    # permission, AppImages either refuse to launch or fall back to
    # running unsandboxed (which for Electron/Chromium apps is strictly
    # worse than the kernel hardening itself).
    #
    # Distro packages (deb/snap/flatpak) ship AppArmor profiles via their
    # packaging system, which is why Chrome, Firefox, etc. still work on
    # hardened Ubuntu out of the box. AppImages deliberately have no
    # system integration — that is the format's whole pitch — so nothing
    # installs profiles on their behalf, and upstream (AppImage, AppMan,
    # pkgforge) has not converged on a fix. AppMan's GUI just asks the
    # user to flip the global sysctl off, which re-exposes the user-
    # namespace kernel attack surface to *every* unprivileged binary on
    # the system, not only the AppImages we trust enough to install.
    #
    # The middle path: keep the global hardening on, and grant `userns`
    # narrowly to the AppImage paths we manage ourselves. AppMan extracts
    # AppImages under ~/AppImages/AppMan/<app>/<app> (symlinked from
    # ~/.local/bin/<app>); ad-hoc AppImages dropped at the top level of
    # ~/AppImages/ are also covered. One profile file handles both.
    #
    # To undo: remove /etc/apparmor.d/appman-appimages and
    # `sudo apparmor_parser -R` it, then reload AppArmor. The global
    # restriction stays in place; only these specific paths lose their
    # exemption.

    - name: AppMan | install AppArmor userns profile for managed AppImages
      ansible.builtin.copy:
        dest: /etc/apparmor.d/appman-appimages
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by installs/custom-installers.yml — do not edit by hand.
          # Grants the `userns` capability to:
          #   - AppImages installed via AppMan
          #     (~/AppImages/AppMan/<app>/<app>, symlinked into ~/.local/bin)
          #   - ad-hoc AppImages at the top level of ~/AppImages/
          # Everything else on the system remains subject to the
          # unprivileged-userns restriction.
          abi <abi/4.0>,
          include <tunables/global>

          profile appman-appimages-appman /home/*/AppImages/AppMan/*/* flags=(unconfined) {
            userns,
            include if exists <local/appman-appimages>
          }

          profile appman-appimages-toplevel /home/*/AppImages/*.{AppImage,appimage} flags=(unconfined) {
            userns,
            include if exists <local/appman-appimages>
          }
      become: yes
      register: appman_apparmor_profile

    - name: AppMan | reload AppArmor profile
      ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/appman-appimages
      become: yes
      when: appman_apparmor_profile.changed

    # ════════════════════════════════════════════════════════════════════════
    # CHROMIUM SUID SANDBOX — setuid helpers for Nix ungoogled-chromium + google-chrome
    # ════════════════════════════════════════════════════════════════════════
    # The Nix chromium wrapper expects a setuid-root SUID sandbox helper at
    # /run/wrappers/bin/__chromium-suid-sandbox (NixOS creates this via
    # security.chromiumSuidSandbox; a plain Nix-on-Ubuntu install does not).
    # Without it Chromium aborts at launch, because Ubuntu's AppArmor also
    # clamps unprivileged user namespaces so the namespace sandbox is
    # unavailable too. google-chrome (nix/modules/packages.nix) hits the same
    # issue with its own bundled chrome-sandbox; since Chrome ignores
    # CHROME_DEVEL_SANDBOX in release builds, its setuid helper
    # (__google-chrome-suid-sandbox) is bind-mounted directly over the Nix
    # store's chrome-sandbox path instead — see scripts/chromium-suid-sandbox.sh.
    #
    # Two pieces are needed, mirroring what NixOS' security.wrappers does:
    #   1. A dedicated tmpfs at /run/wrappers that ALLOWS suid + exec. The host
    #      /run is mounted nosuid,noexec, which both strips the setuid bit and
    #      forbids execution — so the helpers cannot live directly under /run.
    #   2. A boot-time oneshot that installs both setuid helpers into it (tmpfs
    #      is wiped on every boot).
    # Run by tag:
    #   ansible-playbook custom-installers.yml --ask-become-pass --tags chromium_sandbox
    # After a chromium/chrome update (home-manager switch):
    #   sudo systemctl restart chromium-suid-sandbox

    - name: Chromium sandbox | install suid/exec-capable tmpfs mount for /run/wrappers
      ansible.builtin.copy:
        dest: /etc/systemd/system/run-wrappers.mount
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by installs/custom-installers.yml — do not edit by hand.
          # Dedicated tmpfs that permits setuid + exec (host /run is nosuid,noexec),
          # so the Chromium SUID sandbox helper can live at /run/wrappers/bin.
          [Unit]
          Description=Suid/exec-capable tmpfs for setuid wrapper helpers
          DefaultDependencies=no
          Conflicts=umount.target
          Before=umount.target
          After=local-fs.target

          [Mount]
          What=tmpfs
          Where=/run/wrappers
          Type=tmpfs
          Options=rw,nodev,mode=755,size=2M

          [Install]
          WantedBy=multi-user.target
      become: yes
      register: chromium_sandbox_mount
      tags: chromium_sandbox

    - name: Chromium sandbox | install setuid-helper installer script
      ansible.builtin.copy:
        src: scripts/chromium-suid-sandbox.sh
        dest: /usr/local/bin/chromium-suid-sandbox
        owner: root
        group: root
        mode: '0755'
      become: yes
      tags: chromium_sandbox

    - name: Chromium sandbox | install systemd boot service
      ansible.builtin.copy:
        dest: /etc/systemd/system/chromium-suid-sandbox.service
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by installs/custom-installers.yml — do not edit by hand.
          [Unit]
          Description=Install setuid SUID sandbox helpers for Nix ungoogled-chromium + google-chrome
          # Needs the suid/exec-capable /run/wrappers tmpfs in place first.
          Requires=run-wrappers.mount
          After=run-wrappers.mount

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/chromium-suid-sandbox

          [Install]
          WantedBy=multi-user.target
      become: yes
      register: chromium_sandbox_unit
      tags: chromium_sandbox

    - name: Chromium sandbox | reload systemd if units changed
      ansible.builtin.systemd:
        daemon_reload: yes
      become: yes
      when: chromium_sandbox_mount.changed or chromium_sandbox_unit.changed
      tags: chromium_sandbox

    - name: Chromium sandbox | enable + (re)start tmpfs mount
      ansible.builtin.systemd:
        name: run-wrappers.mount
        enabled: yes
        state: restarted
      become: yes
      tags: chromium_sandbox

    - name: Chromium sandbox | enable + (re)start service (installs helper now)
      ansible.builtin.systemd:
        name: chromium-suid-sandbox.service
        enabled: yes
        state: restarted
      become: yes
      tags: chromium_sandbox

    # ════════════════════════════════════════════════════════════════════════
    # LOOKING GLASS (KVMFR) — https://github.com/gnif/LookingGlass
    # Host side for viewing a Windows VM through the Looking Glass IDD: the
    # kvmfr kernel module (via dkms) exposing /dev/kvmfr0 as IVSHMEM backing,
    # plus the udev/AppArmor/cgroup permissions QEMU and the client need.
    # The client itself is Nix-managed (packages.nix); VM creation and the
    # guest IDD install are in scripts/looking-glass/README.md.
    # Run alone: ansible-playbook custom-installers.yml --tags looking_glass -K
    # ════════════════════════════════════════════════════════════════════════

    - name: Looking Glass | install VM + module build prerequisites
      ansible.builtin.apt:
        name:
          - dkms
          - "linux-headers-{{ ansible_facts['kernel'] }}"
          - swtpm        # TPM 2.0 emulator, required by Windows 11
          - swtpm-tools
          # libvirtd + virsh. Explicit because a past `apt autoremove` silently
          # dropped the daemon (virt-manager comes from Nix, so nothing on the
          # apt side kept it marked as needed).
          - libvirt-daemon-system
          - libvirt-clients
        state: present
      become: yes
      tags: looking_glass

    - name: Looking Glass | read installed kvmfr source rev
      ansible.builtin.slurp:
        src: "/usr/src/kvmfr-{{ kvmfr_version }}/.looking-glass-rev"
      register: kvmfr_rev_stamp
      failed_when: false
      tags: looking_glass

    - name: Looking Glass | decide whether kvmfr needs (re)installing
      ansible.builtin.set_fact:
        kvmfr_needs_install: >-
          {{ kvmfr_rev_stamp.content is not defined
             or (kvmfr_rev_stamp.content | b64decode | trim) != looking_glass_rev }}
      tags: looking_glass

    - name: Looking Glass | remove previous kvmfr dkms module
      ansible.builtin.command: dkms remove "kvmfr/{{ kvmfr_version }}" --all
      become: yes
      failed_when: false
      when: kvmfr_needs_install | bool
      tags: looking_glass

    - name: Looking Glass | clear previous kvmfr source tree
      ansible.builtin.file:
        path: "/usr/src/kvmfr-{{ kvmfr_version }}"
        state: absent
      become: yes
      when: kvmfr_needs_install | bool
      tags: looking_glass

    - name: Looking Glass | download source tarball at pinned rev
      ansible.builtin.get_url:
        url: "https://codeload.github.com/gnif/LookingGlass/tar.gz/{{ looking_glass_rev }}"
        dest: /tmp/looking-glass-src.tar.gz
        mode: '0644'
      when: kvmfr_needs_install | bool
      tags: looking_glass

    - name: Looking Glass | create kvmfr dkms source directory
      ansible.builtin.file:
        path: "/usr/src/kvmfr-{{ kvmfr_version }}"
        state: directory
        mode: '0755'
      become: yes
      when: kvmfr_needs_install | bool
      tags: looking_glass

    - name: Looking Glass | extract module/ into dkms source directory
      ansible.builtin.unarchive:
        src: /tmp/looking-glass-src.tar.gz
        dest: "/usr/src/kvmfr-{{ kvmfr_version }}"
        remote_src: yes
        extra_opts:
          - --strip-components=2
          - --wildcards
          - "*/module/*"
      become: yes
      when: kvmfr_needs_install | bool
      tags: looking_glass

    - name: Looking Glass | dkms add + build + install kvmfr
      ansible.builtin.shell: |
        set -e
        dkms add "kvmfr/{{ kvmfr_version }}"
        dkms install "kvmfr/{{ kvmfr_version }}"
        echo "{{ looking_glass_rev }}" > "/usr/src/kvmfr-{{ kvmfr_version }}/.looking-glass-rev"
      become: yes
      when: kvmfr_needs_install | bool
      tags: looking_glass

    - name: Looking Glass | clean up source tarball
      ansible.builtin.file:
        path: /tmp/looking-glass-src.tar.gz
        state: absent
      tags: looking_glass

    - name: Looking Glass | set kvmfr shared memory size
      ansible.builtin.copy:
        dest: /etc/modprobe.d/kvmfr.conf
        content: |
          # Managed by installs/custom-installers.yml — do not edit by hand.
          # Must equal the IVSHMEM 'size' in the VM's <qemu:commandline> (MiB × 1048576).
          options kvmfr static_size_mb={{ kvmfr_static_size_mb }}
        mode: '0644'
      become: yes
      tags: looking_glass

    - name: Looking Glass | load kvmfr at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kvmfr.conf
        content: |
          # Managed by installs/custom-installers.yml — KVMFR Looking Glass module
          kvmfr
        mode: '0644'
      become: yes
      tags: looking_glass

    - name: Looking Glass | udev rule granting the seat user access to /dev/kvmfr0
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/70-kvmfr.rules
        # 70- sorts before 73-seat-late.rules so the uaccess tag is honoured.
        content: |
          # Managed by installs/custom-installers.yml — do not edit by hand.
          SUBSYSTEM=="kvmfr", GROUP="kvm", MODE="0660", TAG+="uaccess"
        mode: '0644'
      become: yes
      register: kvmfr_udev_rule
      tags: looking_glass

    - name: Looking Glass | reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      become: yes
      when: kvmfr_udev_rule.changed
      tags: looking_glass

    - name: Looking Glass | allow QEMU (AppArmor) to use /dev/kvmfr0
      ansible.builtin.blockinfile:
        path: /etc/apparmor.d/local/abstractions/libvirt-qemu
        create: yes
        mode: '0644'
        marker: "# {mark} Looking Glass — managed by installs/custom-installers.yml"
        block: |
          /dev/kvmfr0 rw,
      become: yes
      register: kvmfr_apparmor
      tags: looking_glass

    - name: Looking Glass | allow QEMU (cgroup device ACL) to use /dev/kvmfr0
      # The stock Ubuntu qemu.conf ships cgroup_device_acl commented out, so this
      # block is the only active definition: libvirt's defaults + /dev/kvmfr0.
      ansible.builtin.blockinfile:
        path: /etc/libvirt/qemu.conf
        marker: "# {mark} Looking Glass — managed by installs/custom-installers.yml"
        block: |
          cgroup_device_acl = [
              "/dev/null", "/dev/full", "/dev/zero",
              "/dev/random", "/dev/urandom",
              "/dev/ptmx", "/dev/kvm", "/dev/userfaultfd",
              "/dev/kvmfr0"
          ]
      become: yes
      register: kvmfr_qemu_conf
      tags: looking_glass

    - name: Looking Glass | reload AppArmor
      ansible.builtin.systemd:
        name: apparmor
        state: reloaded
      become: yes
      when: kvmfr_apparmor.changed
      tags: looking_glass

    # Load before libvirtd/any VM starts: if QEMU opens /dev/kvmfr0 first it
    # creates a plain file there and the module can't create its char device.
    - name: Looking Glass | load kvmfr module now
      community.general.modprobe:
        name: kvmfr
        params: "static_size_mb={{ kvmfr_static_size_mb }}"
        state: present
      become: yes
      tags: looking_glass

    - name: Looking Glass | enable + start libvirtd
      ansible.builtin.systemd:
        name: libvirtd
        enabled: yes
        state: "{{ 'restarted' if kvmfr_qemu_conf.changed else 'started' }}"
      become: yes
      tags: looking_glass

    # The package only activates the NAT network on first install; after a
    # remove/reinstall (leftover config) it stays inactive with autostart off.
    - name: Looking Glass | start + autostart libvirt default NAT network
      ansible.builtin.shell: |
        set -e
        info=$(virsh -c qemu:///system net-info default)
        changed=0
        if ! grep -Eq '^Active:\s+yes' <<<"$info"; then
          virsh -c qemu:///system net-start default; changed=1
        fi
        if ! grep -Eq '^Autostart:\s+yes' <<<"$info"; then
          virsh -c qemu:///system net-autostart default; changed=1
        fi
        echo "changed=$changed"
      args:
        executable: /bin/bash
      become: yes
      register: libvirt_default_net
      changed_when: "'changed=1' in libvirt_default_net.stdout"
      tags: looking_glass
