# User-managed fragment that /etc/nix/nix.conf !includes (Determinate Nix
# installer leaves this file alone once created). bootstrap.sh appends it
# on fresh hosts; keep in sync across machines by editing here.

# llm-agents.nix binaries (claude-code, codex, opencode*, cursor-agent, ...)
# are prebuilt and published daily at cache.numtide.com. The flake pins
# llm-agents to a ≥PIN_AGE_DAYS_LLM_AGENTS-old commit (update.d/10-nix.sh)
# so the store paths in flake.lock are always covered by this cache —
# without the substituter entry below, the daemon doesn't know to query it
# and builds those derivations from source instead.
extra-substituters = https://cache.numtide.com
extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
