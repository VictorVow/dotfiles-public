# Explicit localhost so ansible doesn't warn about an empty/implicit inventory.
# Interpreter pinned to the controller's Python, matching the implicit-localhost behaviour.
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"

# Remote hosts. lord-ubuntu is reachable over SSH (tailnet) as user `lord`;
# used by ansible/lord-ubuntu.yml for its user-level (no-sudo) setup.
[server]
lord-ubuntu ansible_user=lord ansible_python_interpreter=/usr/bin/python3
