</div>
<script>
  // wrap the wide table in a horizontal-scroll container
  document.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div');
    w.className = 'tablewrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
</script>
<script>
  // Shared ordinal scales (low -> high), the single source of truth used by
  // both the Points weighting and the column sorter. Each scale is an ordered
  // list of bucket words; a column "belongs" to whichever scale contains all of
  // its values.
  window.PL_SCALES = [
    ['very small', 'small', 'medium', 'large', 'very large'],
    ['very slow', 'slow', 'medium', 'fast', 'very fast'],
    ['very low', 'low', 'medium', 'high', 'very high'],
    ['very easy', 'easy', 'medium', 'difficult', 'very difficult'],
    ['none', 'minimal', 'good', 'first-class', 'pure'],
    ['compiled/native', 'managed/execution engine', 'interpreted/dynamic (repl)'],
    ['bad', 'poor', 'average', 'good', 'excellent'],
    ['no', 'partial', 'yes'],
    ['dynamic', 'static'],
    ['weak', 'strong']
  ];
</script>
<script>
  // Inject a "Points" column (client-side only — NOT in the Markdown) whose
  // value for each row is computed from per-column, per-bucket weights set in a
  // "Weights" panel above the table. Weights persist in localStorage
  // (pl-weights-v1) and, on first run, are pre-seeded from any manual points
  // saved by the earlier click-to-score feature (pl-points-v1) — the mean of
  // the values the user gave each bucket. Runs BEFORE the sort script so the
  // injected column gets correct indices (and is sortable by total).
  (function () {
    var WEIGHTS_KEY = 'pl-weights-v1';
    var MANUAL_KEY = 'pl-points-v1';
    var SCALES = window.PL_SCALES || [];

    function loadJSON(key) {
      try { return JSON.parse(localStorage.getItem(key)) || null; }
      catch (e) { return null; }
    }
    function saveWeights(obj) {
      try { localStorage.setItem(WEIGHTS_KEY, JSON.stringify(obj)); }
      catch (e) { /* private mode / file:// — persistence unavailable */ }
    }

    function headerLabel(headRow, idx) {
      var h = headRow.cells[idx];
      if (!h) return '';
      var clone = h.cloneNode(true);
      var a = clone.querySelector('.sort-arrow');
      if (a) a.remove();
      return (clone.textContent || '').trim();
    }
    function cellText(tr, idx) {
      var c = tr.cells[idx];
      return c ? (c.textContent || '').trim() : '';
    }
    // Pick the scale that covers the most of a column's distinct values. A
    // column is weightable if some scale covers >= 2 of its values and leaves at
    // most one outlier (e.g. Assembly's "Untyped"/"None" don't disqualify the
    // otherwise-binary Static/Dynamic and Strong/Weak columns; the outlier just
    // gets no weight). Genuinely text columns cover 0 and stay excluded.
    function scaleFor(values) {
      var seen = {};
      values.forEach(function (v) { v = v.toLowerCase(); if (v) seen[v] = true; });
      var distinct = Object.keys(seen);
      if (!distinct.length) return null;
      var best = null, bestCover = 0;
      SCALES.forEach(function (scale) {
        var cover = distinct.filter(function (v) { return scale.indexOf(v) !== -1; }).length;
        if (cover > bestCover) { bestCover = cover; best = scale; }
      });
      if (best && bestCover >= 2 && (distinct.length - bestCover) <= 1) return best;
      return null;
    }

    document.querySelectorAll('table').forEach(function (table) {
      if (!table.tHead || !table.tBodies.length) return;
      var headRow = table.tHead.rows[0];
      var tbody = table.tBodies[0];

      // inject Points header + body cells
      var th = document.createElement('th');
      th.className = 'points-col';
      th.textContent = 'Points';
      th.title = 'Computed from the per-bucket weights set in the Weights panel. ' +
        "Hover a row's Points for the breakdown.";
      headRow.insertBefore(th, headRow.cells[0]);

      var rows = Array.prototype.slice.call(tbody.rows);
      rows.forEach(function (tr) {
        var td = document.createElement('td');
        td.className = 'points-col';
        tr.insertBefore(td, tr.cells[0]);
      });

      // match the Language column's sticky offset to the real Points width
      table.style.setProperty('--points-w', th.offsetWidth + 'px');

      // weightable (rating) columns: those whose values all fit one scale
      // (skip Points col 0 and Language col 1). Capture each present bucket's
      // display text too, for nice panel labels.
      var ratingCols = [];
      Array.prototype.forEach.call(headRow.cells, function (h, idx) {
        if (idx <= 1) return;
        var scale = scaleFor(rows.map(function (tr) { return cellText(tr, idx); }));
        if (!scale) return;
        var displayByLower = {};
        rows.forEach(function (tr) {
          var t = cellText(tr, idx);
          if (t) displayByLower[t.toLowerCase()] = t;
        });
        ratingCols.push({
          idx: idx,
          label: headerLabel(headRow, idx),
          scale: scale,
          display: displayByLower
        });
      });
      var colByLabel = {};
      ratingCols.forEach(function (c) { colByLabel[c.label] = c; });

      function weightFor(label, bucketLower) {
        var col = weights[label];
        if (!col) return 0;
        var w = col[bucketLower];
        return typeof w === 'number' && !isNaN(w) ? w : 0;
      }

      // pre-seed weights from existing manual points (mean per column+bucket)
      function seedFromManual() {
        var manual = loadJSON(MANUAL_KEY);
        if (!manual) return null;
        var langToRow = {};
        rows.forEach(function (tr) { langToRow[cellText(tr, 1)] = tr; });
        var acc = {}; // acc[label][bucketLower] = { sum, count }
        Object.keys(manual).forEach(function (lang) {
          var tr = langToRow[lang];
          if (!tr) return;
          var cols = manual[lang] || {};
          Object.keys(cols).forEach(function (label) {
            var c = colByLabel[label];
            if (!c) return; // not a weightable column
            var bucket = cellText(tr, c.idx).toLowerCase();
            if (c.scale.indexOf(bucket) === -1) return; // value off-scale
            var val = cols[label];
            if (typeof val !== 'number' || !val) return;
            if (!acc[label]) acc[label] = {};
            if (!acc[label][bucket]) acc[label][bucket] = { sum: 0, count: 0 };
            acc[label][bucket].sum += val;
            acc[label][bucket].count += 1;
          });
        });
        var out = {};
        Object.keys(acc).forEach(function (label) {
          out[label] = {};
          Object.keys(acc[label]).forEach(function (bucket) {
            var a = acc[label][bucket];
            out[label][bucket] = Math.round(a.sum / a.count);
          });
        });
        return Object.keys(out).length ? out : null;
      }

      var weights = loadJSON(WEIGHTS_KEY);
      var seeded = false;
      if (!weights) {
        var s = seedFromManual();
        if (s) { weights = s; seeded = true; saveWeights(weights); }
        else { weights = {}; }
      }

      function computeRow(tr) {
        var total = 0, lines = [];
        ratingCols.forEach(function (c) {
          var bucket = cellText(tr, c.idx);
          var w = weightFor(c.label, bucket.toLowerCase());
          if (w) {
            total += w;
            lines.push((w > 0 ? '+' : '') + w + ' ' + bucket + ' (' + c.label + ')');
          }
        });
        var pc = tr.cells[0];
        pc.textContent = String(total);
        pc.title = 'Points: ' + total +
          (lines.length ? '\n' + lines.join('\n') : '\n(no weights set)');
      }
      function computeAll() { rows.forEach(computeRow); }

      // ---- toolbar: Weights toggle + Reset + the panel ----
      var toolbar = document.createElement('div');
      toolbar.className = 'points-toolbar';

      var panel = document.createElement('div');
      panel.className = 'weights-panel';

      var toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = 'clear-points-btn';
      function setCollapsed(collapsed) {
        panel.hidden = collapsed;
        toggleBtn.textContent = collapsed ? 'Weights ▸' : 'Weights ▾';
      }
      toggleBtn.addEventListener('click', function () { setCollapsed(!panel.hidden); });

      var resetBtn = document.createElement('button');
      resetBtn.type = 'button';
      resetBtn.className = 'clear-points-btn';
      resetBtn.textContent = 'Reset';
      resetBtn.addEventListener('click', function () {
        if (!window.confirm('Reset all bucket weights to 0?')) return;
        weights = {};
        saveWeights(weights);
        Array.prototype.forEach.call(panel.querySelectorAll('input'), function (inp) {
          inp.value = '';
        });
        computeAll();
      });

      // one group per rating column, with a number input per present bucket
      ratingCols.forEach(function (c) {
        var group = document.createElement('div');
        group.className = 'weights-col';
        var lab = document.createElement('div');
        lab.className = 'weights-col-label';
        lab.textContent = c.label;
        group.appendChild(lab);
        var inputs = document.createElement('div');
        inputs.className = 'weights-inputs';
        c.scale.forEach(function (bucketLower) {
          var disp = c.display[bucketLower];
          if (!disp) return; // bucket not present in this column
          var field = document.createElement('label');
          field.className = 'weights-field';
          var name = document.createElement('span');
          name.textContent = disp;
          var inp = document.createElement('input');
          inp.type = 'number';
          inp.step = '1';
          var cur = weightFor(c.label, bucketLower);
          inp.value = cur ? String(cur) : '';
          inp.addEventListener('input', function () {
            if (!weights[c.label]) weights[c.label] = {};
            var v = parseFloat(inp.value);
            if (isNaN(v) || v === 0) delete weights[c.label][bucketLower];
            else weights[c.label][bucketLower] = v;
            saveWeights(weights);
            computeAll();
          });
          field.appendChild(name);
          field.appendChild(inp);
          inputs.appendChild(field);
        });
        group.appendChild(inputs);
        panel.appendChild(group);
      });

      toolbar.appendChild(toggleBtn);
      toolbar.appendChild(resetBtn);
      toolbar.appendChild(panel);
      var wrap = table.closest('.tablewrap') || table;
      wrap.parentNode.insertBefore(toolbar, wrap);

      setCollapsed(!seeded); // auto-expand on first-run seeding
      computeAll();
    });
  })();
</script>
<script>
  // click-to-sort columns. Ordinal rating columns sort by their scale's order;
  // everything else sorts as (natural) text. Click toggles ascending / descending.
  (function () {
    var SCALES = window.PL_SCALES || [];
    function text(td) { return (td.textContent || '').trim(); }

    // Pick the scale for a column from its non-empty values; null if none fits.
    function scaleFor(values) {
      var vals = values.map(function (v) { return v.toLowerCase(); }).filter(Boolean);
      if (!vals.length) return null;
      return SCALES.find(function (scale) {
        return vals.every(function (v) { return scale.indexOf(v) !== -1; });
      }) || null;
    }

    document.querySelectorAll('table').forEach(function (table) {
      if (!table.tHead || !table.tBodies.length) return;
      var headRow = table.tHead.rows[0];
      Array.prototype.forEach.call(headRow.cells, function (th, col) {
        th.addEventListener('click', function () { sortBy(table, headRow, col, th); });
      });
    });

    function sortBy(table, headRow, col, th) {
      var tbody = table.tBodies[0];
      var rows = Array.prototype.slice.call(tbody.rows);
      var scale = scaleFor(rows.map(function (r) { return text(r.cells[col]); }));

      var dir = th.getAttribute('data-dir') === 'asc' ? 'desc' : 'asc';
      Array.prototype.forEach.call(headRow.cells, function (h) {
        h.removeAttribute('data-dir');
        var a = h.querySelector('.sort-arrow');
        if (a) a.remove();
      });
      th.setAttribute('data-dir', dir);
      var sign = dir === 'asc' ? 1 : -1;

      rows.sort(function (a, b) {
        var ta = text(a.cells[col]), tb = text(b.cells[col]);
        var cmp;
        if (scale) {
          var ra = scale.indexOf(ta.toLowerCase()), rb = scale.indexOf(tb.toLowerCase());
          cmp = (ra === -1 ? Infinity : ra) - (rb === -1 ? Infinity : rb);
        } else {
          cmp = ta.localeCompare(tb, undefined, { numeric: true, sensitivity: 'base' });
        }
        return cmp * sign;
      });
      rows.forEach(function (r) { tbody.appendChild(r); });

      var arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = dir === 'asc' ? ' ▲' : ' ▼';
      th.appendChild(arrow);
    }
  })();
</script>
</body>
</html>
