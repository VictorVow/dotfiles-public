<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programming language comparison</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    margin: 0;
    padding: 2rem clamp(1rem, 4vw, 3rem);
    color: #1b1f23;
    background: #fff;
  }
  h2 { margin-top: 0; }
  blockquote {
    border-left: 4px solid #d0d7de;
    margin: 1rem 0;
    padding: 0.25rem 1rem;
    color: #57606a;
  }
  .tablewrap { overflow-x: auto; border: 1px solid #d0d7de; border-radius: 6px; }
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  th, td {
    border: 1px solid #d0d7de;
    padding: 0.5rem 0.7rem;
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #f6f8fa;
    z-index: 1;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: #eaeef2; }
  .sort-arrow { font-size: 0.8em; opacity: 0.7; }
  tbody tr:nth-child(even) { background: #fafbfc; }
  /* first column sticks while scrolling sideways */
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    background: #f6f8fa;
    font-weight: 600;
  }
  abbr[title] { text-decoration: underline dotted; cursor: help; }
  code {
    background: rgba(175,184,193,0.2);
    padding: 0.1em 0.3em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #c9d1d9; background: #0d1117; }
    blockquote { border-left-color: #30363d; color: #8b949e; }
    .tablewrap { border-color: #30363d; }
    th, td { border-color: #30363d; }
    thead th, th:first-child, td:first-child { background: #161b22; }
    tbody tr:nth-child(even) { background: #0f141a; }
    code { background: rgba(110,118,129,0.4); }
  }
</style>
</head>
<body>
<div class="tablewrap-outer">
