<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programming language comparison</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    margin: 0;
    padding: 2rem clamp(1rem, 4vw, 3rem);
    color: #1b1f23;
    background: #fff;
  }
  h2 { margin-top: 0; }
  blockquote {
    border-left: 4px solid #d0d7de;
    margin: 1rem 0;
    padding: 0.25rem 1rem;
    color: #57606a;
  }
  .tablewrap { overflow-x: auto; border: 1px solid #d0d7de; border-radius: 6px; }
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  th, td {
    border: 1px solid #d0d7de;
    padding: 0.5rem 0.7rem;
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #f6f8fa;
    z-index: 1;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: #eaeef2; }
  .sort-arrow { font-size: 0.8em; opacity: 0.7; }
  tbody tr:nth-child(even) { background: #fafbfc; }
  /* injected client-side Points column */
  .points-col {
    width: 56px;
    min-width: 56px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  td.points-col { cursor: help; font-weight: 600; }
  /* first two columns (Points, then Language) stick while scrolling sideways */
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    background: #f6f8fa;
    font-weight: 600;
  }
  th:nth-child(2), td:nth-child(2) {
    position: sticky;
    left: var(--points-w, 56px);
    background: #f6f8fa;
    font-weight: 600;
  }
  thead th:first-child, thead th:nth-child(2) { z-index: 2; }
  .points-toolbar {
    margin: 0 0 0.75rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  .clear-points-btn {
    font: inherit;
    padding: 0.35rem 0.8rem;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #f6f8fa;
    cursor: pointer;
  }
  .clear-points-btn:hover { background: #eaeef2; }
  .weights-panel {
    flex-basis: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1.25rem;
    margin-top: 0.4rem;
    padding: 0.75rem;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #f6f8fa;
    box-sizing: border-box;
  }
  .weights-panel[hidden] { display: none; }
  .weights-col-label { font-weight: 600; font-size: 0.8rem; margin-bottom: 0.3rem; }
  .weights-inputs { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .weights-field {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    font-size: 0.65rem;
    color: #57606a;
    gap: 0.1rem;
  }
  .weights-field input {
    width: 3.4rem;
    font: inherit;
    font-size: 0.8rem;
    padding: 0.12rem 0.3rem;
    border: 1px solid #d0d7de;
    border-radius: 4px;
    background: #fff;
  }
  abbr[title], abbr[data-tip] { text-decoration: underline dotted; cursor: help; }
  .pl-tooltip {
    position: fixed;
    z-index: 1000;
    display: none;
    max-width: 32rem;
    padding: 0.5rem 0.7rem;
    font-size: 1.5rem;
    line-height: 1.35;
    white-space: pre-wrap;
    background: #1b1f23;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    pointer-events: none;
  }
  code {
    background: rgba(175,184,193,0.2);
    padding: 0.1em 0.3em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #c9d1d9; background: #0d1117; }
    blockquote { border-left-color: #30363d; color: #8b949e; }
    .tablewrap { border-color: #30363d; }
    th, td { border-color: #30363d; }
    thead th, th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { background: #161b22; }
    tbody tr:nth-child(even) { background: #0f141a; }
    .clear-points-btn { background: #161b22; border-color: #30363d; color: #c9d1d9; }
    .clear-points-btn:hover { background: #21262d; }
    .weights-panel { background: #161b22; border-color: #30363d; }
    .weights-field { color: #8b949e; }
    .weights-field input { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
    code { background: rgba(110,118,129,0.4); }
  }
</style>
</head>
<body>
<div class="tablewrap-outer">
