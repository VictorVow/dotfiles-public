</div>
<script>
  // Use the document's first Markdown heading as the browser tab title,
  // overriding the static <title> in header.html.
  (function () {
    var h = document.querySelector('h1, h2, h3, h4, h5, h6');
    var t = h && (h.textContent || '').trim();
    if (t) document.title = t;
    // Per-document key for namespacing localStorage. The server injects
    // PL_DOC_KEY (the source filename); standalone HTML falls back to the
    // first heading so distinct docs don't share Compare/weights state.
    window.PL_DOC_KEY = window.PL_DOC_KEY || t || 'default';
  })();
</script>
<script>
  // wrap the wide table in a horizontal-scroll container
  document.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div');
    w.className = 'tablewrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
</script>
<script>
  // Shared ordinal scales (low -> high), the single source of truth used by
  // both the Points weighting and the column sorter. Each scale is an ordered
  // list of bucket words; a column "belongs" to whichever scale contains all of
  // its values.
  window.PL_SCALES = [
    ['very small', 'small', 'medium', 'large', 'very large'],
    ['very slow', 'slow', 'medium', 'fast', 'very fast'],
    ['none', 'very low', 'low', 'medium', 'high', 'very high'],
    ['very easy', 'easy', 'medium', 'difficult', 'very difficult'],
    ['none', 'minimal', 'good', 'first-class', 'pure'],
    ['none', 'adapter', 'compatible', 'first-class', 'native'],
    ['compiled/native', 'managed/execution engine', 'interpreted/dynamic (repl)'],
    ['bad', 'poor', 'average', 'good', 'excellent'],
    ['no', 'partial', 'yes'],
    ['none', 'third-party', 'built-in', 'first-class'],
    ['minimal', 'basic', 'good', 'strong', 'first-class'],
    ['none', 'checker-only', 'minimal', 'local', 'strong local', 'global'],
    ['none', 'duck-typed', 'structural', 'hybrid', 'nominal'],
    ['none', 'faint', 'moderate', 'strong', 'identical'],
    ['dynamic', 'static'],
    ['weak', 'strong'],
    ['immediate', 'retained', 'declarative'],
    ['1', '2', '3', '4', '5', '6']
  ];
</script>
<script>
  // Inject a "Points" column (client-side only — NOT in the Markdown) whose
  // value for each row is computed from per-column, per-bucket weights set in a
  // "Weights" panel above the table. Weights persist in localStorage
  // (pl-weights-v1) and, on first run, are pre-seeded from any manual points
  // saved by the earlier click-to-score feature (pl-points-v1) — the mean of
  // the values the user gave each bucket. Runs BEFORE the sort script so the
  // injected column gets correct indices (and is sortable by total).
  (function () {
    var DOC = window.PL_DOC_KEY || 'default';
    var WEIGHTS_KEY = 'pl-weights-v1:' + DOC;
    var MANUAL_KEY = 'pl-points-v1:' + DOC;
    var SCALES = window.PL_SCALES || [];

    function loadJSON(key) {
      try { return JSON.parse(localStorage.getItem(key)) || null; }
      catch (e) { return null; }
    }
    function saveWeights(obj) {
      try { localStorage.setItem(WEIGHTS_KEY, JSON.stringify(obj)); }
      catch (e) { /* private mode / file:// — persistence unavailable */ }
    }

    function headerLabel(headRow, idx) {
      var h = headRow.cells[idx];
      if (!h) return '';
      var clone = h.cloneNode(true);
      var a = clone.querySelector('.sort-arrow');
      if (a) a.remove();
      return (clone.textContent || '').trim();
    }
    function cellText(tr, idx) {
      var c = tr.cells[idx];
      return c ? (c.textContent || '').trim() : '';
    }
    // Pick the scale that covers the most of a column's distinct values. A
    // column is weightable if some scale covers >= 2 of its values and leaves at
    // most one outlier (e.g. Assembly's "Untyped"/"None" don't disqualify the
    // otherwise-binary Static/Dynamic and Strong/Weak columns; the outlier just
    // gets no weight). Genuinely text columns cover 0 and stay excluded.
    function scaleFor(values) {
      var seen = {};
      values.forEach(function (v) { v = v.toLowerCase(); if (v) seen[v] = true; });
      var distinct = Object.keys(seen);
      if (!distinct.length) return null;
      var best = null, bestCover = 0;
      SCALES.forEach(function (scale) {
        var cover = distinct.filter(function (v) { return scale.indexOf(v) !== -1; }).length;
        if (cover > bestCover) { bestCover = cover; best = scale; }
      });
      if (best && bestCover >= 2 && (distinct.length - bestCover) <= 1) return best;
      return null;
    }

    document.querySelectorAll('table').forEach(function (table) {
      if (!table.tHead || !table.tBodies.length) return;
      var headRow = table.tHead.rows[0];
      var tbody = table.tBodies[0];

      // inject Points header + body cells
      var th = document.createElement('th');
      th.className = 'points-col';
      th.textContent = 'Points';
      th.setAttribute('data-tip', 'Computed from the per-bucket weights set in the Weights panel. ' +
        "Hover a row's Points for the breakdown.");
      headRow.insertBefore(th, headRow.cells[0]);

      var rows = Array.prototype.slice.call(tbody.rows);
      rows.forEach(function (tr) {
        var td = document.createElement('td');
        td.className = 'points-col';
        tr.insertBefore(td, tr.cells[0]);
      });

      // match the Language column's sticky offset to the real Points width
      table.style.setProperty('--points-w', th.offsetWidth + 'px');

      // weightable (rating) columns: those whose values all fit one scale
      // (skip Points col 0 and Language col 1). Capture each present bucket's
      // display text too, for nice panel labels.
      var ratingCols = [];
      Array.prototype.forEach.call(headRow.cells, function (h, idx) {
        if (idx <= 1) return;
        var scale = scaleFor(rows.map(function (tr) { return cellText(tr, idx); }));
        if (!scale) return;
        var displayByLower = {};
        rows.forEach(function (tr) {
          var t = cellText(tr, idx);
          if (t) displayByLower[t.toLowerCase()] = t;
        });
        ratingCols.push({
          idx: idx,
          label: headerLabel(headRow, idx),
          scale: scale,
          display: displayByLower
        });
      });
      var colByLabel = {};
      ratingCols.forEach(function (c) { colByLabel[c.label] = c; });

      function weightFor(label, bucketLower) {
        var col = weights[label];
        if (!col) return 0;
        var w = col[bucketLower];
        return typeof w === 'number' && !isNaN(w) ? w : 0;
      }

      // pre-seed weights from existing manual points (mean per column+bucket)
      function seedFromManual() {
        var manual = loadJSON(MANUAL_KEY);
        if (!manual) return null;
        var langToRow = {};
        rows.forEach(function (tr) { langToRow[cellText(tr, 1)] = tr; });
        var acc = {}; // acc[label][bucketLower] = { sum, count }
        Object.keys(manual).forEach(function (lang) {
          var tr = langToRow[lang];
          if (!tr) return;
          var cols = manual[lang] || {};
          Object.keys(cols).forEach(function (label) {
            var c = colByLabel[label];
            if (!c) return; // not a weightable column
            var bucket = cellText(tr, c.idx).toLowerCase();
            if (c.scale.indexOf(bucket) === -1) return; // value off-scale
            var val = cols[label];
            if (typeof val !== 'number' || !val) return;
            if (!acc[label]) acc[label] = {};
            if (!acc[label][bucket]) acc[label][bucket] = { sum: 0, count: 0 };
            acc[label][bucket].sum += val;
            acc[label][bucket].count += 1;
          });
        });
        var out = {};
        Object.keys(acc).forEach(function (label) {
          out[label] = {};
          Object.keys(acc[label]).forEach(function (bucket) {
            var a = acc[label][bucket];
            out[label][bucket] = Math.round(a.sum / a.count);
          });
        });
        return Object.keys(out).length ? out : null;
      }

      var weights = loadJSON(WEIGHTS_KEY);
      var seeded = false;
      if (!weights) {
        var s = seedFromManual();
        if (s) { weights = s; seeded = true; saveWeights(weights); }
        else { weights = {}; }
      }

      function computeRow(tr) {
        var total = 0, parts = [];
        ratingCols.forEach(function (c) {
          // read by stable column index so Points stays correct after Compare
          // reorders columns; falls back to positional before cells are stamped.
          var cell = tr.querySelector('[data-col-index="' + c.idx + '"]') || tr.cells[c.idx];
          var bucket = cell ? (cell.textContent || '').trim() : '';
          var w = weightFor(c.label, bucket.toLowerCase());
          if (w) {
            total += w;
            parts.push({ w: w, text: (w > 0 ? '+' : '') + w + ' ' + bucket + ' (' + c.label + ')' });
          }
        });
        parts.sort(function (a, b) { return b.w - a.w; }); // most positive first
        var lines = parts.map(function (p) { return p.text; });
        var pc = tr.cells[0];
        pc.textContent = String(total);
        pc.setAttribute('data-tip', 'Points: ' + total +
          (lines.length ? '\n' + lines.join('\n') : '\n(no weights set)'));
      }
      function computeAll() { rows.forEach(computeRow); }

      // ---- toolbar: Weights toggle + Reset + the panel ----
      var toolbar = document.createElement('div');
      toolbar.className = 'points-toolbar';

      var panel = document.createElement('div');
      panel.className = 'weights-panel';

      var toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = 'clear-points-btn';
      function setCollapsed(collapsed) {
        panel.hidden = collapsed;
        toggleBtn.textContent = collapsed ? 'Weights ▸' : 'Weights ▾';
      }
      toggleBtn.addEventListener('click', function () { setCollapsed(!panel.hidden); });

      var resetBtn = document.createElement('button');
      resetBtn.type = 'button';
      resetBtn.className = 'clear-points-btn';
      resetBtn.textContent = 'Reset';
      resetBtn.addEventListener('click', function () {
        if (!window.confirm('Reset all bucket weights to 0?')) return;
        weights = {};
        persist(weights);
        Array.prototype.forEach.call(panel.querySelectorAll('input'), function (inp) {
          inp.value = '';
        });
        computeAll();
      });

      // ---- Compare: pick languages, then filter to them + group matching cols ----
      var COMPARE_KEY = 'pl-compare-v1:' + (window.PL_DOC_KEY || 'default');
      function loadCompare() {
        try { var a = JSON.parse(localStorage.getItem(COMPARE_KEY)); return Array.isArray(a) ? a : []; }
        catch (e) { return []; }
      }
      function saveCompare() {
        try { localStorage.setItem(COMPARE_KEY, JSON.stringify(selectedNames)); }
        catch (e) { /* private mode / file:// — persistence unavailable */ }
      }
      var selectedNames = loadCompare();
      var compareMode = false; // selection mode: hover-highlight + click-to-pick
      var comparing = false;   // "Compare Now" filter + column grouping applied

      // Stamp each cell with its stable original column index (Points already
      // injected at 0) so column reordering can always be undone.
      Array.prototype.forEach.call(headRow.cells, function (c, i) { c.dataset.colIndex = i; });
      rows.forEach(function (tr) {
        Array.prototype.forEach.call(tr.cells, function (c, i) { c.dataset.colIndex = i; });
      });

      var compareBtn = document.createElement('button');
      compareBtn.type = 'button';
      compareBtn.className = 'clear-points-btn';
      compareBtn.textContent = 'Compare';

      var compareNowBtn = document.createElement('button');
      compareNowBtn.type = 'button';
      compareNowBtn.className = 'clear-points-btn';
      compareNowBtn.textContent = 'Compare Now';
      compareNowBtn.hidden = true;

      var namesSpan = document.createElement('span');
      namesSpan.className = 'compare-names';

      function cellByIndex(tr, idx) { return tr.querySelector('[data-col-index="' + idx + '"]'); }
      // Position-independent value read — survives column reordering (unlike the
      // positional cellText helper above).
      function valueAt(tr, idx) { var c = cellByIndex(tr, idx); return c ? (c.textContent || '').trim() : ''; }
      function langOf(tr) { return valueAt(tr, 1); }
      function isSelected(name) { return selectedNames.indexOf(name) !== -1; }

      function markRows() {
        rows.forEach(function (tr) {
          tr.classList.toggle('compare-selected', isSelected(langOf(tr)));
        });
      }
      function renderNames() {
        namesSpan.textContent = selectedNames.join(', ');
        var enough = selectedNames.length >= 2;
        compareNowBtn.hidden = !enough;
        if (!enough && comparing) clearCompare(); // dropped below 2 → undo
      }
      function toggleSelect(name) {
        var i = selectedNames.indexOf(name);
        if (i === -1) selectedNames.push(name); else selectedNames.splice(i, 1);
        saveCompare();
        markRows();
        renderNames();
        if (comparing) applyCompare(); // keep filter/grouping in sync
      }

      // appendChild moves a node, so re-appending cells in `order` reorders them
      function applyOrder(order) {
        [headRow].concat(rows).forEach(function (tr) {
          order.forEach(function (idx) {
            var c = cellByIndex(tr, idx);
            if (c) tr.appendChild(c);
          });
        });
      }
      function clearDivider() {
        Array.prototype.forEach.call(table.querySelectorAll('.compare-divider'), function (c) {
          c.classList.remove('compare-divider');
        });
      }
      // Columns (idx >= 2; Points + Language stay pinned left) whose value is
      // identical across every selected row move to the right, with a divider
      // before the first such column.
      function distinctCount(sel, idx) {
        var seen = {};
        sel.forEach(function (tr) { seen[valueAt(tr, idx)] = true; });
        return Object.keys(seen).length;
      }
      function reorderColumns() {
        var sel = rows.filter(function (tr) { return isSelected(langOf(tr)); });
        var differ = [], match = [];
        // iterate by stable colIndex, not DOM position (columns may be reordered)
        for (var idx = 2; idx < headRow.cells.length; idx++) {
          var n = distinctCount(sel, idx);
          (n <= 1 ? match : differ).push(idx);
        }
        // most-differing columns first (e.g. all-distinct before nearly-uniform)
        differ.sort(function (a, b) {
          return distinctCount(sel, b) - distinctCount(sel, a) || a - b;
        });
        applyOrder([0, 1].concat(differ, match));
        clearDivider();
        if (match.length && differ.length) {
          [headRow].concat(rows).forEach(function (tr) {
            var c = cellByIndex(tr, match[0]);
            if (c) c.classList.add('compare-divider');
          });
        }
      }
      function restoreColumns() {
        var asc = [];
        for (var i = 0; i < headRow.cells.length; i++) asc.push(i);
        applyOrder(asc);
        clearDivider();
      }

      function applyCompare() {
        comparing = true;
        compareNowBtn.classList.add('active');
        rows.forEach(function (tr) { tr.hidden = !isSelected(langOf(tr)); });
        reorderColumns();
      }
      function clearCompare() {
        comparing = false;
        compareNowBtn.classList.remove('active');
        rows.forEach(function (tr) { tr.hidden = false; });
        restoreColumns();
      }

      compareBtn.addEventListener('click', function () {
        compareMode = !compareMode;
        compareBtn.classList.toggle('active', compareMode);
        table.classList.toggle('compare-hover', compareMode);
      });
      compareNowBtn.addEventListener('click', function () {
        if (comparing) clearCompare(); else applyCompare();
      });
      tbody.addEventListener('click', function (e) {
        if (!compareMode) return;
        var tr = e.target.closest ? e.target.closest('tr') : null;
        if (!tr || tr.parentNode !== tbody) return;
        toggleSelect(langOf(tr));
      });

      markRows();
      renderNames();

      // one group per rating column, with a number input per present bucket
      ratingCols.forEach(function (c) {
        var group = document.createElement('div');
        group.className = 'weights-col';
        var lab = document.createElement('div');
        lab.className = 'weights-col-label';
        lab.textContent = c.label;
        group.appendChild(lab);
        var inputs = document.createElement('div');
        inputs.className = 'weights-inputs';
        c.scale.forEach(function (bucketLower) {
          var disp = c.display[bucketLower];
          if (!disp) return; // bucket not present in this column
          var field = document.createElement('label');
          field.className = 'weights-field';
          var name = document.createElement('span');
          name.textContent = disp;
          var inp = document.createElement('input');
          inp.type = 'number';
          inp.step = '1';
          inp.dataset.col = c.label;
          inp.dataset.bucket = bucketLower;
          var cur = weightFor(c.label, bucketLower);
          inp.value = cur ? String(cur) : '';
          inp.addEventListener('input', function () {
            if (!weights[c.label]) weights[c.label] = {};
            var v = parseFloat(inp.value);
            if (isNaN(v) || v === 0) delete weights[c.label][bucketLower];
            else weights[c.label][bucketLower] = v;
            persist(weights);
            computeAll();
          });
          field.appendChild(name);
          field.appendChild(inp);
          inputs.appendChild(field);
        });
        group.appendChild(inputs);
        panel.appendChild(group);
      });

      toolbar.appendChild(toggleBtn);
      toolbar.appendChild(resetBtn);
      toolbar.appendChild(compareBtn);
      toolbar.appendChild(compareNowBtn);
      toolbar.appendChild(namesSpan);
      toolbar.appendChild(panel);
      var wrap = table.closest('.tablewrap') || table;
      wrap.parentNode.insertBefore(toolbar, wrap);

      var serverAvailable = false;
      function persist(obj) {
        saveWeights(obj); // localStorage cache / standalone fallback
        if (serverAvailable && typeof fetch === 'function') {
          try {
            fetch(window.PL_WEIGHTS_URL || '/weights', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(obj)
            });
          } catch (e) { /* ignore network errors */ }
        }
      }
      function refreshInputs() {
        Array.prototype.forEach.call(panel.querySelectorAll('input'), function (inp) {
          var w = weightFor(inp.dataset.col, inp.dataset.bucket);
          inp.value = w ? String(w) : '';
        });
      }

      setCollapsed(!seeded); // auto-expand on first-run seeding
      computeAll();

      // When served by the live preview server, its on-disk weights file is the
      // source of truth; opened as a static file (no server), localStorage is used.
      if (typeof fetch === 'function') {
        fetch(window.PL_WEIGHTS_URL || '/weights', { cache: 'no-store' }).then(function (r) {
          if (!r.ok) throw new Error('no server');
          return r.json();
        }).then(function (server) {
          serverAvailable = true;
          if (server && Object.keys(server).length) {
            weights = server;          // server wins
            saveWeights(weights);      // cache locally
            refreshInputs();
            computeAll();
            if (table._plResort) table._plResort(); // re-sort on new Points
          } else if (Object.keys(weights).length) {
            persist(weights);          // seed the empty server from local/seeded weights
          }
        }).catch(function () { /* standalone / no server: localStorage only */ });
      }
    });
  })();
</script>
<script>
  // click-to-sort columns. Ordinal rating columns sort by their scale's order;
  // everything else sorts as (natural) text. Click toggles ascending / descending.
  (function () {
    var SCALES = window.PL_SCALES || [];
    function text(td) { return (td.textContent || '').trim(); }

    // Pick the scale for a column from its non-empty values; null if none fits.
    function scaleFor(values) {
      var vals = values.map(function (v) { return v.toLowerCase(); }).filter(Boolean);
      if (!vals.length) return null;
      return SCALES.find(function (scale) {
        return vals.every(function (v) { return scale.indexOf(v) !== -1; });
      }) || null;
    }

    document.querySelectorAll('table').forEach(function (table) {
      if (!table.tHead || !table.tBodies.length) return;
      var headRow = table.tHead.rows[0];
      Array.prototype.forEach.call(headRow.cells, function (th, col) {
        th.addEventListener('click', function () { sortBy(table, headRow, col, th); });
      });

      // Re-apply whichever column is currently sorted, keeping its direction.
      // Used after the async on-disk weights load recomputes Points, so the row
      // order tracks the new values instead of going stale.
      table._plResort = function () {
        var active = headRow.querySelector('th[data-dir]');
        if (!active) return;
        var dir = active.getAttribute('data-dir');
        var ci = active.dataset.colIndex != null
          ? Number(active.dataset.colIndex)
          : Array.prototype.indexOf.call(headRow.cells, active);
        active.setAttribute('data-dir', dir === 'asc' ? 'desc' : 'asc'); // sortBy toggles back
        sortBy(table, headRow, ci, active);
      };

      // On load, default-sort by the injected Points column, descending.
      var pointsTh = headRow.cells[0];
      if (pointsTh && pointsTh.classList.contains('points-col')) {
        pointsTh.setAttribute('data-dir', 'asc'); // sortBy toggles asc -> desc
        sortBy(table, headRow, 0, pointsTh);
      }
    });

    function sortBy(table, headRow, col, th) {
      var tbody = table.tBodies[0];
      var rows = Array.prototype.slice.call(tbody.rows);
      // Resolve cells by the stable data-col-index stamp (set by the Points/
      // Compare script), so sorting stays correct after Compare reorders the
      // columns. Falls back to the positional index when unstamped.
      var ci = th.dataset.colIndex != null ? Number(th.dataset.colIndex) : col;
      function cell(r) { return r.querySelector('[data-col-index="' + ci + '"]') || r.cells[col]; }
      var scale = scaleFor(rows.map(function (r) { return text(cell(r)); }));

      var dir = th.getAttribute('data-dir') === 'asc' ? 'desc' : 'asc';
      Array.prototype.forEach.call(headRow.cells, function (h) {
        h.removeAttribute('data-dir');
        var a = h.querySelector('.sort-arrow');
        if (a) a.remove();
      });
      th.setAttribute('data-dir', dir);
      var sign = dir === 'asc' ? 1 : -1;

      rows.sort(function (a, b) {
        var ta = text(cell(a)), tb = text(cell(b));
        var cmp;
        if (scale) {
          var ra = scale.indexOf(ta.toLowerCase()), rb = scale.indexOf(tb.toLowerCase());
          cmp = (ra === -1 ? Infinity : ra) - (rb === -1 ? Infinity : rb);
        } else {
          cmp = ta.localeCompare(tb, undefined, { numeric: true, sensitivity: 'base' });
        }
        return cmp * sign;
      });
      rows.forEach(function (r) { tbody.appendChild(r); });

      var arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = dir === 'asc' ? ' ▲' : ' ▼';
      th.appendChild(arrow);
    }
  })();
</script>
<script>
  // Custom hover tooltips: instant (no delay), larger font, and they stay open
  // while the pointer moves between cells (the text just swaps) instead of the
  // native title close/reopen. Driven by mouseover/mousemove, so — unlike native
  // title tooltips — they also show when the browser window isn't focused.
  // Text comes from data-tip, migrated from any title attribute so the native
  // tooltip never competes.
  (function () {
    Array.prototype.forEach.call(document.querySelectorAll('[title]'), function (el) {
      el.setAttribute('data-tip', el.getAttribute('title'));
      el.removeAttribute('title');
    });

    var tip = document.createElement('div');
    tip.className = 'pl-tooltip';
    document.body.appendChild(tip);
    var shown = null;

    function place(x, y) {
      var pad = 14, r = tip.getBoundingClientRect();
      var left = x + pad, top = y + pad + 4;
      if (left + r.width + 4 > window.innerWidth) left = x - r.width - pad;
      if (left < 4) left = 4;
      if (top + r.height + 4 > window.innerHeight) top = y - r.height - pad;
      if (top < 4) top = 4;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
    }
    function showFrom(target, x, y) {
      var el = target && target.closest ? target.closest('[data-tip]') : null;
      var text = el ? el.getAttribute('data-tip') : null;
      if (text) {
        if (text !== shown) { tip.textContent = text; shown = text; }
        tip.style.display = 'block';
        place(x, y);
      } else if (shown !== null) {
        tip.style.display = 'none';
        shown = null;
      }
    }
    document.addEventListener('mouseover', function (e) { showFrom(e.target, e.clientX, e.clientY); }, { passive: true });
    document.addEventListener('mousemove', function (e) { showFrom(e.target, e.clientX, e.clientY); }, { passive: true });
    document.addEventListener('mouseout', function (e) {
      if (!e.relatedTarget) { tip.style.display = 'none'; shown = null; }
    });
  })();
</script>
