---
- name: Setup packages on Kubuntu
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    test: yes # Random test vars



  tasks:
    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Become to show id
      ansible.builtin.command:
        cmd: whoami
      become: true
      become_exe: "{{ 'sudo.ws' if ansible_facts.packages['sudo-rs'] is defined else 'sudo' }}"
      changed_when: false
      register: whoami_result

    - name: Install apt packages
      ansible.builtin.apt:
        name:
          - adb
          - btop # Better than htop
          - cpulimit # In Yakuake, used to limit etesync-dav | Note that cgroups is a better maintained alternative though different method
          - distrobox
          # - podman # Unclear if these are still distrobox dependencies or not
          # - slirp4netns # Unclear if these are still distrobox dependencies or not
          # - dotnet-sdk-7.0 # Space Station 14 / C# | check using `dotnet --list-sdks` - doesn't exist in 24.04
          - earlyoom
          - fastboot
          - fastfetch
          - flatpak
          - firejail
          - ffmpeg
          - gamemode
          - gamescope
          - plasma-gamemode
          - gdebi # Installing DEBs whilst handling dependencies
          - gh # GitHub CLI
          - git
          - gnome-disk-utility # (for formatting USBs to exFAT i.e. compatible with all OS)
          - gnupg
          - gpg
          - gocryptfs # needed for KDE plasma-vault
          - haruna # hardware video decoding seems to work better and CPU usage lower than Flatpak
          - htop
          - inxi # for checking what hardware is detected e.g. GPU
          - kio-admin # Allows Dolphin to run as root
          - ktorrent
          - libayatana-appindicator3-1 # Lutris tray icon
          - logiops # For Logitech mouse/keyboard customisation
          - lutris
          - lynx # text-only browser
          - mediainfo
          - mediainfo-gui
          - micro # Alternative to `nano` with sane keybindings
          - mono-complete
          - mullvad-vpn
          - nvtop # GPU monitor like htop https://github.com/Syllo/nvtop
          - openjdk-17-jdk # Java. Needed for Remnants of the Precursors, Minecraft (via Prism Launcher)
          - openjdk-17-jre
          - pavucontrol # PulseAudio volume control / Need for SongRec (Flatpak, uses Shazam API) music identification
          # - pinentry # For GPG code-signing Git commits - doesn't exist in 24.04?
          - piper # GTK applications for configuring devices
          - plasma-discover-backend-flatpak

          # podman / distrobox dependencies
          - crun # for rootless containers | alternative to runc | needed for distrobox/podman
          - passt

          - postfix # Mail Transfer Agent, needed so cronjobs store their error messages
          - power-profiles-daemon # For adjusting the power management profiles
          - puddletag

          #- shadow / Not available on Ubuntu, not sure why it's needed
          - python3-xlib # Needed for key-mon
          - rootlesskit

          - python3-pip
          - pipx
          - rclone
          - recoll

          # Rust
          - cargo
          - rustc

          - scrcpy

          # Shadow PC
          - libva-wayland2
          - libva-drm2
          - libva-glx2 # https://support.shadow.tech/en_US/articles/known-issues-for-shadow/known-issues-for-shadow/64e310046593fd01eb5e8255#_12da2a5b-74fb-496c-86e7-efbc89133fe7
          - libvdpau1
          - libcurl4

          - screen
          - signal-desktop
          - simplescreenrecorder
          - solaar
          - speech-dispatcher # Needed for Firefox's SpeechSynthesis API, used for TTS in Reader Mode https://support.mozilla.org/en-US/kb/speechd-setup?as=u&utm_source=inproduct
          - steam
          - streamlink # https://github.com/streamlink/streamlink
          - sqlitebrowser
          - synaptic
          - syncthing
          - tmux

          # Visual Studio Code
          - apt-transport-https
          - code
          - software-properties-common
          - wget
          - gpg

          - virt-manager
          - virtualenv
          - vnstat
          - wine

          - xdg-desktop-portal-gnome # Need to install this for Flameshot + NormCap to work on Wayland [source] [https://github.com/flameshot-org/flameshot/issues/1910#issuecomment-1001955046
          # Note: xdg-desktop-portal-kde + xdg-desktop-portal-gtk and xdg-desktop-portal are being installed by default on Kubuntu

        state: present
        update_cache: yes
      become: yes

    - name: Find all scripts in the 3rd-party-packages subdirectory
      find:
        paths: "3rd-party-packages"
        patterns: "*.sh"
        use_regex: no
      register: found_scripts

    - name: Execute each script in the 3rd-party-packages subdirectory
      shell: bash "{{ item.path }}"
      loop: "{{ found_scripts.files }}"
      when: found_scripts.matched > 0
      tags: run_scripts
      no_log: true

    # https://docs.ansible.com/ansible/latest/collections/community/general/pipx_module.html
    - name: Inject dependencies via pipx
      become: false
      community.general.pipx:
        name: ansible
        inject_packages:
        # ansible
        # fanficfare
          - yt-dlp[default] # https://github.com/yt-dlp/yt-dlp/pull/11255
          - poetry # Python dependency management, also for leech-master software
          - click # Needed for leech-master
          - key-mon # For showing keys and mouseclicks on video recording/streaming
          - uv # Python version management
        state: inject

    # pipx list to list installed packages
    - name: Upgrade all pipx packages
      community.general.pipx:
        state: upgrade_all

    - name: Upgrade yt-dlp nightly version
      community.general.pipx:
        name: yt-dlp
        state: upgrade
        pip_args: "--pre"  # If you specifically want pre-release versions

    #- name: Install pip libraries
    #  ansible.builtin.pip:
    #    name:
    #      - click # Needed for leech-master

    # npm
    # npm list -g --depth=0 to list globally installed packages
    - name: Install NPM packages globally and upgrade them
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: latest
      loop:
        - corepack # For managing package manager versions (npm, yarn, pnpm)
        - "@anthropic-ai/claude-code" # Claude LLM CLI
        - cline # CLI for Cline LLM
        - "@continuedev/cli" # CLI for Continue Dev LLM
        - deno # For yt-dlp https://github.com/yt-dlp/yt-dlp/issues/14404
        - typescript

    # homebrew
    - name: Update homebrew and upgrade all packages
      community.general.homebrew:
        update_homebrew: true
        upgrade_all: true

    # Consider brewfiles at some point https://docs.brew.sh/Brew-Bundle-and-Brewfile
    # brew leaves | xargs brew list --versions to list installed top-level packages
    - name: Install multiple Homebrew packages
      community.general.homebrew:
        name: "{{ item }}"
        state: present
      loop:
        - clojure/tools/clojure # For Clojure development (for Logseq dev)
        - gh # GitHub CLI
        - jackett # For qBittorrent search plugin, a torrent indexer
        - neovim
        - nvm
        - ruby
        - scrcpy
        - sniffnet
        - zrok
    

