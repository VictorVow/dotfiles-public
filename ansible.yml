---
# ansible.yml — System-level package configuration for Kubuntu.
#
# SCOPE: This playbook now manages ONLY packages that require root access,
# system services, or system-level integration. All user-space packages have
# been migrated to Nix Home Manager (see nix/home.nix and nix/modules/).
#
# Run order:
#   1. ./bootstrap.sh          — Installs Nix + activates Home Manager config
#   2. ansible-playbook ansible.yml --ask-become-pass   ← this file
#
# To see what moved to Nix, check nix/modules/packages.nix.

- name: Setup system-level packages on Kubuntu
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    test: yes # Random test vars

  tasks:
    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Become to show id
      ansible.builtin.command:
        cmd: whoami
      become: true
      changed_when: false
      register: whoami_result

    # ── sudo: add Nix profile paths to secure_path ──────────────────────
    # By default sudo resets PATH to secure_path, which doesn't include
    # Nix-managed binaries. This drop-in appends the user and system Nix
    # profile bin dirs so `sudo micro`, `sudo waydroid init`, etc. work
    # without full-path workarounds.
    - name: Add Nix paths to sudo secure_path
      ansible.builtin.copy:
        dest: /etc/sudoers.d/nix-path
        content: |
          Defaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/boss/.nix-profile/bin:/nix/var/nix/profiles/default/bin"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      become: yes

    # ── sudo: passwordless root steps for update.sh ─────────────────────
    # Lets update-all run unattended (the update-all systemd user timer in
    # nix/modules/services.nix). Only these exact command lines are allowed —
    # sudo matches arguments literally, so any other apt-get/systemctl/env
    # invocation still asks for a password. Keep in sync with
    # update.d/20-apt.sh and update.d/10-nix.sh. (`:` and `=` must be
    # backslash-escaped inside sudoers arguments.)
    - name: Passwordless sudo for update.sh's root steps
      ansible.builtin.copy:
        dest: /etc/sudoers.d/update-all
        content: |
          Cmnd_Alias UPDATE_ALL = \
            /usr/bin/apt-get update -qq, \
            /usr/bin/env DEBIAN_FRONTEND\=noninteractive /usr/bin/apt-get upgrade -y --with-new-pkgs -o Dpkg\:\:Options\:\:\=--force-confdef -o Dpkg\:\:Options\:\:\=--force-confold, \
            /usr/bin/env DEBIAN_FRONTEND\=noninteractive /usr/bin/apt-get autoremove -y, \
            /usr/bin/systemctl restart chromium-suid-sandbox.service
          boss ALL=(root) NOPASSWD: UPDATE_ALL
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      become: yes

    # ── Hydra assets-host block (remote bundle.js RCE mitigation) ──────────
    # Stock Hydra Launcher builds fetch + eval `assets.hydralauncher.gg/bundle.js`
    # in the renderer with full window.electron bridge access — a remote-code
    # slot controlled by whoever owns/MITMs that CDN. Two-layer local block:
    #   1. /etc/hosts null-route (primary; survives ECH, needs no refresh)
    #   2. iptables/ip6tables TLS-SNI string match, applied at boot by a
    #      oneshot systemd unit (catches raw-IP / DoH-resolved connections;
    #      matches hostname not IP → no collateral to other Cloudflare sites).
    # Effect on the app while blocked: catalogue filters + remote playtime
    # executable-map degrade gracefully; downloads/auth/library unaffected.
    # See scripts/hydra-block.sh and docs/system/ for details.
    - name: Install hydra-block script
      ansible.builtin.copy:
        src: scripts/hydra-block.sh
        dest: /usr/local/sbin/hydra-block
        owner: root
        group: root
        mode: "0755"
      become: yes

    - name: Null-route assets.hydralauncher.gg in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^{{ item.ip }}\\s+assets\\.hydralauncher\\.gg"
        line: "{{ item.ip }} assets.hydralauncher.gg # hydra-block"
        state: present
      loop:
        - {ip: "0.0.0.0"}
        - {ip: "::1"}
      become: yes

    - name: Create hydra-block boot service (iptables SNI match)
      ansible.builtin.copy:
        dest: /etc/systemd/system/hydra-block.service
        content: |
          [Unit]
          Description=Block outbound TLS to assets.hydralauncher.gg (SNI match)
          After=network-pre.target
          Before=network.target
          Wants=network-pre.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/hydra-block --enable-fw
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      become: yes
      notify: Reload systemd daemon

    - name: Enable and start hydra-block service
      ansible.builtin.systemd:
        name: hydra-block
        enabled: yes
        state: started
      become: yes

    # ── User groups: evdev access for OBS input-overlay ──────────────────
    # /dev/input/event* is root:input 660 by default, so reading raw
    # keyboard/mouse events (OBS's input-overlay plugin — the key-mon
    # replacement, see nix/modules/gui-apps.nix) needs the user in `input`.
    # Requires a logout/login (or `newgrp input`) after first apply.
    - name: Add user to input group (evdev access for OBS input-overlay)
      ansible.builtin.user:
        name: boss
        groups: input
        append: yes
      become: yes

    # ── Snap: remove and permanently block ──────────────────────────────
    # Snap is not used — all packages come from Nix, apt, or Flatpak.
    # Removing snapd frees ~150 MB RAM (snapd daemon + snap mounts) and
    # prevents Ubuntu from silently installing snap packages behind apt.
    # noqa below: pipefail would break this — `grep -q` exits early, so
    # `snap list` gets SIGPIPE and the `if` turns false.
    - name: Remove all installed snaps  # noqa: risky-shell-pipe
      ansible.builtin.shell: |
        if command -v snap &>/dev/null && snap list 2>/dev/null | grep -qv '^Name'; then
          snap list 2>/dev/null | awk 'NR>1 {print $1}' | while read pkg; do
            snap remove --purge "$pkg" 2>/dev/null || true
          done
        fi
      become: yes
      changed_when: false

    - name: Remove snapd and related packages
      ansible.builtin.apt:
        name:
          - snapd
          - gnome-software-plugin-snap
        state: absent
        purge: yes
        autoremove: yes
      become: yes

    - name: Pin snapd to prevent reinstallation
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/no-snapd
        content: |
          Package: snapd
          Pin: release a=*
          Pin-Priority: -10
        owner: root
        group: root
        mode: "0644"
      become: yes

    - name: Clean up leftover snap directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /snap
        - /var/snap
        - /var/lib/snapd
        - /var/cache/snapd
        - "{{ ansible_facts['env']['HOME'] }}/snap"
      become: yes

    - name: Install system-level apt packages
      ansible.builtin.apt:
        name:
          # ── Distrobox / container infrastructure ──────────────────────────
          # Note: distrobox, crun, passt, rootlesskit are in Nix user profile.
          # These are system-level optional dependencies / workarounds only.
          # podman is now managed by Nix (nix#podman). Held in apt to prevent reinstalls.

          # ── KDE Essentials ───────────────────────────────────────────────
          # These are marked manual (apt-mark manual) to prevent autoremove
          # from stripping them when unrelated packages are removed.
          - cryptsetup # The main command-line tool for LUKS encryption/decryption
          - cryptsetup-initramfs # Enables unlocking encrypted volumes at boot
          - gocryptfs # For unlocking Plasma Vaults
          - sddm # Kubuntu login screen (display manager)
          - sddm-theme-breeze # KDE Breeze login theme
          - dolphin # KDE file manager
          - ark # KDE archive manager
          - plasma-runners-addons # KRunner search plugins (calculator, bookmarks, etc.)
          - kde-spectacle # Screenshot tool
          - plasma-widgets-addons # Weather, calculator, notes plasmoids
          - plasma-dataengines-addons # Data engines powering the widget add-ons
          - plasma-wallpapers-addons # Extra wallpapers and slideshow support
          - plasma-calendar-addons # Calendar widget integration
          - grub-theme-breeze # Breeze GRUB theme
          - plymouth-theme-breeze # Breeze boot splash
          - usb-creator-kde # USB startup disk creator
          - alsa-base # ALSA driver configuration files

          # ── KDE Plasma integration ────────────────────────────────────────
          - kio-admin # Allows Dolphin file manager to run as root
          - plasma-gamemode # KDE Plasma integration for Feral's gamemode
          - plasma-discover-backend-flatpak # Flatpak backend for KDE Discover app store
          - kunifiedpush # Unified Push distributor for Logseq plugin notifications

          # ── Flatpak (system-level) ─────────────────────────────────────────
          - flatpak # Flatpak runtime — system-wide integration

          # ── System services ───────────────────────────────────────────────
          - earlyoom # Out-of-memory killer daemon (system service)
          - logiops # Advanced Logitech mouse/keyboard customisation
            # Requires system service + /etc/logiops.yml
          - postfix # Mail Transfer Agent — cronjobs store errors here
          - power-profiles-daemon # Adjusts power management profiles (D-Bus service)
          - vnstat # Network traffic monitor daemon

          # ── System libraries (Shadow PC streaming) ────────────────────────
          # Needed for Shadow PC client GPU acceleration
          # https://support.shadow.tech/en_US/articles/known-issues-for-shadow
          - libva-wayland2
          - libva-drm2
          - libva-glx2
          - libvdpau1
          - libcurl4

          # ── Gaming ────────────────────────
          # Too much effort to get and keep working on a Nix setup
          - steam
          - lutris

          # ── System tray / indicator library ──────────────────────────────
          - libayatana-appindicator3-1 # Tray icon support for Lutris (C library)
          - gir1.2-ayatanaappindicator3-0.1 # GIR typelib needed by Python-GI to load AppIndicator

          # ── XDG Desktop Portal ────────────────────────────────────────────
          # Needed for Flameshot + NormCap to work on Wayland
          # https://github.com/flameshot-org/flameshot/issues/1910#issuecomment-1001955046
          # Note: xdg-desktop-portal-kde + xdg-desktop-portal-gtk and
          # xdg-desktop-portal are installed by default on Kubuntu
          # - xdg-desktop-portal-gnome

          # ── Ubuntu-specific GUI tools ─────────────────────────────────────
          - gdebi # Install .deb packages whilst handling dependencies
          - synaptic # GUI front-end for apt package manager

          # ── System Python tooling ─────────────────────────────────────────
          # Kept at system level for compatibility with system Python workflows.
          # User-space Python tools (uv, yt-dlp) are now in Nix.
          - python3-pip

          # ── apt infrastructure ────────────────────────────────────────────
          - apt-transport-https # HTTPS support for apt repositories
          - software-properties-common # add-apt-repository command
          - wget # File downloader (used by 3rd-party scripts)
          - gpg # GPG key import for apt repos (also in Nix for user use)

          # ── NFS client ────────────────────────────────────────────────────
          - nfs-common # NFSv4 client utils for mounting lord-ubuntu:/home/lord

        state: present
        update_cache: yes
      become: yes

    - name: Hold apt packages superseded by Nix
      # Prevents apt / KDE Discover from reinstalling Kubuntu defaults that are
      # already managed by home-manager. Equivalent to: apt-mark hold <pkg>
      ansible.builtin.dpkg_selections:
        name: "{{ item.name }}"
        selection: hold
      loop:
        - name: procps
          comment: "pgrep, ps, kill — superseded by nix#procps"
        - name: kate
          comment: "KDE text editor — superseded by nix#kdePackages.kate"
      become: yes

    - name: Purge apt packages fully superseded by Nix
      # podman: previously held to prevent reinstall, but having two podmans
      # (apt 5.4.2 + nix 5.7.0) sharing ~/.local/share/containers caused lock
      # contention and a stuck `distrobox upgrade`. Nix podman is the only one
      # distrobox uses (PATH order), so purge the apt one and its systemd units.
      ansible.builtin.apt:
        name:
          - podman
        state: absent
        purge: yes
      become: yes

    # ── Secret Service: KWallet only, drop gnome-keyring ──────────────
    # Kubuntu installs gnome-keyring alongside KWallet, and it grabbed the
    # org.freedesktop.secrets D-Bus name at login. Two live keychains meant
    # Electron/KDE apps (Signal via --password-store=kwallet6) and libsecret
    # clients stored secrets in different places; daemon churn then left
    # Signal unable to decrypt its database on every launch. Purge
    # gnome-keyring so KWallet's ksecretd is the sole Secret Service provider
    # (see nix/modules/desktop.nix for the user-level D-Bus activation file
    # that points org.freedesktop.secrets at ksecretd).
    - name: Remove gnome-keyring (KWallet/ksecretd is the sole Secret Service provider)
      ansible.builtin.apt:
        name:
          - gnome-keyring
          - gnome-keyring-pkcs11
          - libpam-gnome-keyring
        state: absent
        purge: yes
        autoremove: yes
      become: yes

    - name: Pin gnome-keyring to prevent reinstallation
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/no-gnome-keyring
        content: |
          Package: gnome-keyring gnome-keyring-pkcs11 libpam-gnome-keyring
          Pin: release a=*
          Pin-Priority: -10
        owner: root
        group: root
        mode: "0644"
      become: yes

    # Install Solaar's udev rules so it can access Logitech hidraw devices.
    # Solaar is managed by Nix (home.packages), but on non-NixOS the Nix store
    # rules are never auto-installed to /etc/udev/rules.d/. This task resolves
    # the current store path dynamically so it stays correct after Solaar updates.
    - name: Install Solaar udev rules from Nix store
      shell: |
        SOLAAR_BIN=$(readlink -f $(su - boss -c 'which solaar'))
        SOLAAR_PREFIX="${SOLAAR_BIN%/bin/solaar}"
        cp "$SOLAAR_PREFIX/lib/udev/rules.d/42-logitech-unify-permissions.rules" \
           /etc/udev/rules.d/42-logitech-unify-permissions.rules
        udevadm control --reload-rules
        udevadm trigger
      become: yes
      changed_when: false

    # ── Chromium Web Store policy ─────────────────────────────────────────────
    # ungoogled-chromium (nix/modules/packages.nix) isn't Google-branded, so
    # Chromium's built-in check for "is this the real Chrome Web Store" fails
    # and it blocks installs from chromewebstore.google.com with the native
    # "Apps, extensions and user scripts cannot be added from this website"
    # banner — this happens before the chromiumWebStoreExt helper extension
    # even gets a chance to act. ExtensionInstallSources is the sanctioned
    # Chromium policy for allowlisting install origins, but policies are only
    # honored from root-owned /etc paths (by design, so a compromised user
    # account can't self-grant install permissions) — hence this lives here
    # in Ansible rather than in the user-level Nix/Home Manager config.
    - name: Ensure Chromium managed policies directory exists
      ansible.builtin.file:
        path: /etc/chromium/policies/managed
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: yes

    - name: Allow Chrome Web Store installs in Chromium via managed policy
      ansible.builtin.copy:
        dest: /etc/chromium/policies/managed/webstore.json
        content: |
          {
            "ExtensionInstallSources": [
              "https://chromewebstore.google.com/*",
              "https://clients2.google.com/*"
            ]
          }
        owner: root
        group: root
        mode: "0644"
      become: yes

    # NOTE: pipx, npm, and Homebrew package tasks have been removed.
    # Those packages are now managed by Nix Home Manager. See:
    #   nix/modules/packages.nix   — home.packages list
    #   nix/modules/shell.nix      — npm AI CLIs via activation script
    #   nix/modules/programs.nix   — program configurations

    # ── Podman / container infrastructure ────────────────────────────────────
    # Ubuntu 24.04+ sets kernel.apparmor_restrict_unprivileged_userns=1, which
    # blocks crun from writing uid_map when starting rootless containers.
    # /etc/apparmor.d/crun ships with the system and has the correct userns
    # permission, but isn't loaded into the kernel automatically after package
    # install — this task ensures it is. Without it, podman compose fails with:
    #   crun: write to `uid_map`: Operation not permitted: OCI permission denied
    - name: Load AppArmor profile for crun (required for rootless podman)
      ansible.builtin.command:
        cmd: apparmor_parser -r /etc/apparmor.d/crun
      become: yes
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    # ── Steam Linux Runtime (pressure-vessel / srt-bwrap) ────────────────────
    # Ubuntu 25.10+ tightened the unprivileged_userns AppArmor profile so that
    # any unconfined process creating a user namespace is transitioned to
    # unprivileged_userns, which denies capabilities. Steam's bundled bwrap
    # (srt-bwrap) needs to write uid_map to set up the pressure-vessel container
    # that wraps every Proton game. Without this profile all Proton games segfault
    # immediately after chdir, regardless of Proton version.
    - name: Install AppArmor profile for Steam srt-bwrap
      ansible.builtin.copy:
        dest: /etc/apparmor.d/steam-srt-bwrap
        owner: root
        group: root
        mode: "0644"
        content: |
          abi <abi/4.0>,
          include <tunables/global>

          profile steam-srt-bwrap /home/*/.local/share/Steam/**/srt-bwrap flags=(attach_disconnected,mediate_deleted) {
            allow capability,
            allow file rwlkm /{**,},
            allow network,
            allow unix,
            allow ptrace,
            allow signal,
            allow mqueue,
            allow io_uring,
            allow userns,
            allow mount,
            allow umount,
            allow pivot_root,
            allow dbus,
            allow pix /** -> &steam-srt-bwrap//&steam-unpriv-srt-bwrap,
          }

          profile steam-unpriv-srt-bwrap flags=(attach_disconnected,mediate_deleted) {
            allow file rwlkm /{**,},
            allow network,
            allow unix,
            allow ptrace,
            allow signal,
            allow mqueue,
            allow io_uring,
            allow userns,
            allow mount,
            allow umount,
            allow pivot_root,
            allow dbus,
            allow pix /** -> &steam-unpriv-srt-bwrap,
            audit deny capability,
          }
      become: yes
      register: srt_bwrap_profile

    - name: Load AppArmor profile for Steam srt-bwrap
      ansible.builtin.command:
        cmd: apparmor_parser -r /etc/apparmor.d/steam-srt-bwrap
      become: yes
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    # ── Vorta / Flatpak fusermount3 ──────────────────────────────────────────
    # Refs:
    #   https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2120439
    #   https://github.com/borgbase/vorta/issues/2255
    #
    # The upstream AppArmor profile shipped with apparmor 4.x is missing the
    # unix-socket permission that fusermount3 needs when it is invoked from
    # inside the Flatpak sandbox (e.g. by Vorta when mounting a borg archive
    # over sshfs). Without the rule, Vorta crashes on every mount attempt.
    #
    # The upstream profile already does `include if exists <local/fusermount3>`,
    # so dropping the missing rule into the local override is the smallest
    # safe patch — no editing of the distribution-managed profile required, and
    # the override survives apt upgrades of the apparmor package.
    #
    # Note: AppArmor upstream considers this a partial workaround; the long-term
    # fix is conditional treatment of fusermount3 under Flatpak. Revisit when
    # https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2120439 is closed.
    - name: Vorta | install local override for fusermount3 AppArmor profile
      ansible.builtin.copy:
        dest: /etc/apparmor.d/local/fusermount3
        content: |
          # Required for Flatpak apps (e.g. Vorta) that talk to fusermount3
          # over a Unix domain socket. See:
          #   https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2120439
          #   https://github.com/borgbase/vorta/issues/2255
          unix (receive, send) type=stream,
        owner: root
        group: root
        mode: "0644"
      become: yes

    - name: Vorta | reload fusermount3 AppArmor profile
      ansible.builtin.command:
        cmd: apparmor_parser -r /etc/apparmor.d/fusermount3
      become: yes
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    # ── Waydroid ──────────────────────────────────────────────────────────
    # waydroid binary is managed by Nix (home.packages) — no PPA needed.
    # These tasks wire it up as a system service, following the same pattern
    # as the Solaar udev rules above: resolve the Nix store path dynamically
    # so it stays correct after waydroid updates (hms → ansible).
    #
    # Run order: hms first (installs waydroid binary), then ansible.

    - name: Create waydroid-container systemd service pointing to Nix store binary
      ansible.builtin.shell: |
        WAYDROID_BIN=$(readlink -f $(su - boss -c 'which waydroid' 2>/dev/null) 2>/dev/null)
        if [ -z "$WAYDROID_BIN" ]; then
          echo "waydroid not found in boss PATH — run 'hms' first" >&2
          exit 1
        fi
        # Symlink to /usr/local/bin so 'sudo waydroid init' works (sudo loses Nix PATH)
        ln -sf "$WAYDROID_BIN" /usr/local/bin/waydroid
        cat > /etc/systemd/system/waydroid-container.service <<EOF
        [Unit]
        Description=Waydroid Container
        After=network.target local-fs.target

        [Service]
        ExecStart=${WAYDROID_BIN} container start
        ExecStop=${WAYDROID_BIN} container stop
        Restart=on-failure
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF
      become: yes
      changed_when: false
      failed_when: false # non-fatal if hms hasn't run yet

    - name: Install waydroid D-Bus policy from Nix store
      ansible.builtin.shell: |
        WAYDROID_BIN=$(readlink -f $(su - boss -c 'which waydroid' 2>/dev/null) 2>/dev/null)
        [ -z "$WAYDROID_BIN" ] && exit 0
        WAYDROID_PREFIX="${WAYDROID_BIN%/lib/waydroid/waydroid.py}"
        cp "$WAYDROID_PREFIX/share/dbus-1/system.d/id.waydro.Container.conf" \
           /etc/dbus-1/system.d/id.waydro.Container.conf
        systemctl reload dbus
      become: yes
      changed_when: false
      failed_when: false # non-fatal if hms hasn't run yet

    - name: Persist binder_linux kernel module for Waydroid
      ansible.builtin.copy:
        dest: /etc/modules-load.d/waydroid.conf
        content: "binder_linux\n"
        owner: root
        group: root
        mode: "0644"
      become: yes

    - name: Load binder_linux kernel module
      community.general.modprobe:
        name: binder_linux
        state: present
      become: yes
      failed_when: false # non-fatal: module file absent until linux-modules-extra is installed

    - name: Enable and start waydroid-container service
      ansible.builtin.systemd:
        name: waydroid-container
        enabled: yes
        state: started
        daemon_reload: yes
      become: yes
      failed_when: false # non-fatal: service unit absent if hms hasn't run yet

    # ── Kernel cmdline (zswap + amdgpu display fixes) ─────────────────────────
    # zswap: compressed swap cache (zstd) in front of disk swap. Dramatically
    #   reduces swap I/O latency vs plain disk swap.
    #   See: https://chrisdown.name/2026/03/24/zswap-vs-zram-when-to-use-what.html
    # amdgpu.sg_display=0: disables scatter-gather display on the Phoenix APU
    #   (Framework 13 AMD, DCN 3.1). With an external USB-C/DP-alt monitor
    #   connected at boot, the SG display path hangs the display controller —
    #   journal shows "REG_WAIT timeout ... dcn31_program_compbuf_size" and
    #   WARNING in dcn31_hubbub.c, after which BOTH eDP and the external panel
    #   stay black until the monitor is unplugged. Disabling SG display routes
    #   framebuffers through carve-out VRAM instead and resolves the black
    #   screen. (Distinct from the 2026-03-30 suspend/lid black-screen fix below.)
    # amdgpu.dcdebugmask=0x10: disables Panel Self Refresh on the eDP panel
    #   (sink reports PSR ver 3 = PSR-SU). With PSR on, the internal display
    #   flickers on small/partial screen updates. Confirmed 2026-10-19 by
    #   writing 1 to /sys/kernel/debug/dri/*/eDP-1/disallow_edp_enter_psr,
    #   which stopped the flicker. If flicker returns, try 0x610 (also
    #   disables PSR-SU + Panel Replay). Cost: slightly higher idle power.
    - name: Enable zswap (zstd) and amdgpu SG-display + PSR fixes in GRUB
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: "^GRUB_CMDLINE_LINUX_DEFAULT="
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash zswap.enabled=1 zswap.compressor=zstd amdgpu.sg_display=0 amdgpu.dcdebugmask=0x10"'
      become: yes
      notify: Update GRUB

    # ── Suspend / Lid-close fix ────────────────────────────────────────────
    # Prevents spurious ACPI lid events (Framework 13 AMD EC bug with CalDigit
    # TS4 dock) from triggering suspend. Crash analysis: 2026-03-30 00:14 —
    # false lid-close event fired, KWin D-Bus inhibit rejected, systemd-sleep
    # froze user.slice for 30s → both displays went black, required hard reset.
    - name: Ensure systemd logind drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: yes

    - name: Create systemd logind drop-in to ignore lid events
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/lid.conf
        content: |
          [Login]
          HandleLidSwitch=ignore
          HandleLidSwitchExternalPower=ignore
          HandleLidSwitchDocked=ignore
        owner: root
        group: root
        mode: "0644"
      become: yes
      notify: Restart systemd-logind

    - name: Ensure systemd system.conf drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: yes

    - name: Create systemd freeze timeout drop-in
      # Extends the cgroup freeze window from 30s to 90s. If suspend is ever
      # triggered while KWin is active, this gives it more time to freeze
      # cleanly rather than hanging indefinitely until a hard reset is needed.
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/freeze-timeout.conf
        content: |
          [Manager]
          DefaultTimeoutStopSec=90s
        owner: root
        group: root
        mode: "0644"
      become: yes
      notify: Reload systemd daemon

    # ── NFS client mount (lord-ubuntu:/home/lord) ──────────────────────────
    # Persistent, reboot-surviving mount of the server's home dir over the
    # headscale tailnet (WireGuard-encrypted transport, so plaintext NFS is
    # fine). NFSv4 (single port 2049) + systemd automount: mounts lazily on
    # first access to /mnt/lord and unmounts after 10 min idle, so a dropped
    # tailnet link only bites during active use. `soft` returns I/O errors
    # instead of hanging when the server is unreachable. Server-side export is
    # managed in the 1-COMMON repo (common.yml, `nfs` tag). Client + server
    # UID/GID both 1000, so files map cleanly with no idmap config.
    # Is anything already mounted at /mnt/lord (autofs stub or a live NFS
    # mount)? If so, the directory below is the *server's* /home/lord, and
    # enforcing owner/mode would chown over NFS — which root_squash rejects
    # (EPERM). Only manage the bare mount point when nothing is mounted.
    - name: "NFS | detect existing mount at /mnt/lord"
      ansible.builtin.command: findmnt --noheadings --first-only --output FSTYPE /mnt/lord
      register: _nfs_lord_mount
      changed_when: false
      failed_when: false

    - name: "NFS | ensure /mnt/lord mount point exists"
      ansible.builtin.file:
        path: /mnt/lord
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: yes
      when: _nfs_lord_mount.rc != 0

    - name: "NFS | persistent automount of lord-ubuntu:/home/lord in /etc/fstab"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '\s/mnt/lord\s'
        line: "lord-ubuntu:/home/lord  /mnt/lord  nfs4  _netdev,x-systemd.automount,x-systemd.idle-timeout=600,nofail,soft,timeo=30,retrans=3,rw  0  0"
        state: present
      become: yes
      register: _nfs_fstab

    - name: "NFS | reload systemd so the automount unit is generated"
      ansible.builtin.systemd:
        daemon_reload: yes
      become: yes
      # Inline rather than a handler: must run before the next task.
      when: _nfs_fstab.changed  # noqa: no-handler

    - name: "NFS | enable and start the automount unit"
      ansible.builtin.systemd:
        name: mnt-lord.automount
        enabled: yes
        state: started
      become: yes
      when: _nfs_fstab.changed  # noqa: no-handler

    # ── Hermes home bind mount ─────────────────────────────────────────────
    # $HERMES_HOME (~/.hermes) lives in this repo at nix/dotfiles/hermes/home.
    # The Hermes desktop app rejects a symlinked profile home ("Noncanonical
    # gateway profile": it requires realpath(profile_id) == profile_id), so a
    # symlink cannot work — a bind mount keeps /home/boss/.hermes canonical
    # while the data stays in the repo. See nix/dotfiles/hermes/docs/ai-hermes.md.
    - name: "Hermes | ensure ~/.hermes bind-mount point exists"
      ansible.builtin.file:
        path: /home/boss/.hermes
        state: directory
        owner: boss
        group: boss
        mode: "0700"

    - name: "Hermes | persistent bind mount of the repo hermes home"
      ansible.posix.mount:
        path: /home/boss/.hermes
        src: /home/boss/Projects/installs/nix/dotfiles/hermes/home
        fstype: none
        opts: bind
        state: mounted
      become: yes

  handlers:
    - name: Restart systemd-logind
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted
      become: yes

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes
      become: yes

    - name: Update GRUB
      ansible.builtin.command: update-grub
      become: yes
      changed_when: true

- ansible.builtin.import_playbook: custom-installers.yml
