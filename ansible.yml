---
# ansible.yml — System-level package configuration for Kubuntu.
#
# SCOPE: This playbook now manages ONLY packages that require root access,
# system services, or system-level integration. All user-space packages have
# been migrated to Nix Home Manager (see nix/home.nix and nix/modules/).
#
# Run order:
#   1. ./bootstrap.sh          — Installs Nix + activates Home Manager config
#   2. ansible-playbook ansible.yml --ask-become-pass   ← this file
#
# To see what moved to Nix, check nix/modules/packages.nix.

- name: Setup system-level packages on Kubuntu
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    test: yes # Random test vars



  tasks:
    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Become to show id
      ansible.builtin.command:
        cmd: whoami
      become: true
      become_exe: "{{ 'sudo.ws' if ansible_facts.packages['sudo-rs'] is defined else 'sudo' }}"
      changed_when: false
      register: whoami_result

    - name: Install system-level apt packages
      ansible.builtin.apt:
        name:
          # ── Distrobox / container infrastructure ──────────────────────────
          # Note: distrobox, crun, passt, rootlesskit are in Nix user profile.
          # These are system-level optional dependencies / workarounds only.
          # podman is now managed by Nix (nix#podman). Held in apt to prevent reinstalls.

          # ── KDE Essentials ───────────────────────────────────────────────
          # These are marked manual (apt-mark manual) to prevent autoremove
          # from stripping them when unrelated packages are removed.
          - cryptsetup                    # The main command-line tool for LUKS encryption/decryption
          - cryptsetup-initramfs          # Enables unlocking encrypted volumes at boot
          - gocryptfs                     # For unlocking Plasma Vaults
          - sddm                           # Kubuntu login screen (display manager)
          - sddm-theme-breeze              # KDE Breeze login theme
          - dolphin                        # KDE file manager
          - ark                            # KDE archive manager
          - plasma-runners-addons          # KRunner search plugins (calculator, bookmarks, etc.)
          - kde-spectacle                  # Screenshot tool
          - plasma-widgets-addons          # Weather, calculator, notes plasmoids
          - plasma-dataengines-addons      # Data engines powering the widget add-ons
          - plasma-wallpapers-addons       # Extra wallpapers and slideshow support
          - plasma-calendar-addons         # Calendar widget integration
          - grub-theme-breeze              # Breeze GRUB theme
          - plymouth-theme-breeze          # Breeze boot splash
          - usb-creator-kde               # USB startup disk creator
          - alsa-base                      # ALSA driver configuration files

          # ── KDE Plasma integration ────────────────────────────────────────
          - kio-admin                      # Allows Dolphin file manager to run as root
          - plasma-gamemode                # KDE Plasma integration for Feral's gamemode
          - plasma-discover-backend-flatpak # Flatpak backend for KDE Discover app store

          # ── Flatpak (system-level) ─────────────────────────────────────────
          - flatpak                        # Flatpak runtime — system-wide integration

          # ── System services ───────────────────────────────────────────────
          - earlyoom                       # Out-of-memory killer daemon (system service)
          - logiops                        # Advanced Logitech mouse/keyboard customisation
                                           # Requires system service + /etc/logiops.yml
          - postfix                        # Mail Transfer Agent — cronjobs store errors here
          - power-profiles-daemon          # Adjusts power management profiles (D-Bus service)
          - vnstat                         # Network traffic monitor daemon

          # ── System libraries (Shadow PC streaming) ────────────────────────
          # Needed for Shadow PC client GPU acceleration
          # https://support.shadow.tech/en_US/articles/known-issues-for-shadow
          - libva-wayland2
          - libva-drm2
          - libva-glx2
          - libvdpau1
          - libcurl4

          # ── System tray / indicator library ──────────────────────────────
          - libayatana-appindicator3-1     # Tray icon support for Lutris

          # ── XDG Desktop Portal ────────────────────────────────────────────
          # Needed for Flameshot + NormCap to work on Wayland
          # https://github.com/flameshot-org/flameshot/issues/1910#issuecomment-1001955046
          # Note: xdg-desktop-portal-kde + xdg-desktop-portal-gtk and
          # xdg-desktop-portal are installed by default on Kubuntu
          - xdg-desktop-portal-gnome

          # ── Ubuntu-specific GUI tools ─────────────────────────────────────
          - gdebi                          # Install .deb packages whilst handling dependencies
          - synaptic                       # GUI front-end for apt package manager

          # ── System Python tooling ─────────────────────────────────────────
          # Kept at system level for compatibility with system Python workflows.
          # User-space Python tools (poetry, uv, yt-dlp) are now in Nix.
          - python3-pip
          - pipx

          # ── apt infrastructure ────────────────────────────────────────────
          - apt-transport-https            # HTTPS support for apt repositories
          - software-properties-common     # add-apt-repository command
          - wget                           # File downloader (used by 3rd-party scripts)
          - gpg                            # GPG key import for apt repos (also in Nix for user use)

        state: present
        update_cache: yes
      become: yes

    - name: Hold apt packages superseded by Nix
      # Prevents apt / KDE Discover from reinstalling Kubuntu defaults that are
      # already managed by home-manager. Equivalent to: apt-mark hold <pkg>
      ansible.builtin.dpkg_selections:
        name: "{{ item.name }}"
        selection: hold
      loop:
        - { name: procps, comment: "pgrep, ps, kill — superseded by nix#procps" }
        - { name: podman, comment: "OCI backend — superseded by nix#podman (5.8.1 vs apt 5.4.2)" }
        - { name: kate,   comment: "KDE text editor — superseded by nix#kdePackages.kate" }
      become: yes

    - name: Find all scripts in the 3rd-party-packages subdirectory
      find:
        paths: "3rd-party-packages"
        patterns: "*.sh"
        use_regex: no
      register: found_scripts

    - name: Execute each script in the 3rd-party-packages subdirectory
      shell: bash "{{ item.path }}"
      loop: "{{ found_scripts.files }}"
      when: found_scripts.matched > 0
      tags: run_scripts
      no_log: true

    # Install Solaar's udev rules so it can access Logitech hidraw devices.
    # Solaar is managed by Nix (home.packages), but on non-NixOS the Nix store
    # rules are never auto-installed to /etc/udev/rules.d/. This task resolves
    # the current store path dynamically so it stays correct after Solaar updates.
    - name: Install Solaar udev rules from Nix store
      shell: |
        SOLAAR_BIN=$(readlink -f $(su - boss -c 'which solaar'))
        SOLAAR_PREFIX="${SOLAAR_BIN%/bin/solaar}"
        cp "$SOLAAR_PREFIX/lib/udev/rules.d/42-logitech-unify-permissions.rules" \
           /etc/udev/rules.d/42-logitech-unify-permissions.rules
        udevadm control --reload-rules
        udevadm trigger
      become: yes
      changed_when: false

    # NOTE: pipx, npm, and Homebrew package tasks have been removed.
    # Those packages are now managed by Nix Home Manager. See:
    #   nix/modules/packages.nix   — home.packages list
    #   nix/modules/shell.nix      — npm AI CLIs via activation script
    #   nix/modules/programs.nix   — program configurations

    # ── Waydroid ──────────────────────────────────────────────────────────
    # waydroid binary is managed by Nix (home.packages) — no PPA needed.
    # These tasks wire it up as a system service, following the same pattern
    # as the Solaar udev rules above: resolve the Nix store path dynamically
    # so it stays correct after waydroid updates (hms → ansible).
    #
    # Run order: hms first (installs waydroid binary), then ansible.

    - name: Create waydroid-container systemd service pointing to Nix store binary
      ansible.builtin.shell: |
        WAYDROID_BIN=$(readlink -f $(su - boss -c 'which waydroid' 2>/dev/null) 2>/dev/null)
        if [ -z "$WAYDROID_BIN" ]; then
          echo "waydroid not found in boss PATH — run 'hms' first" >&2
          exit 1
        fi
        cat > /etc/systemd/system/waydroid-container.service <<EOF
        [Unit]
        Description=Waydroid Container
        After=network.target local-fs.target

        [Service]
        ExecStart=${WAYDROID_BIN} container start
        ExecStop=${WAYDROID_BIN} container stop
        Restart=on-failure
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF
      become: yes
      changed_when: false
      failed_when: false  # non-fatal if hms hasn't run yet

    - name: Persist binder_linux kernel module for Waydroid
      ansible.builtin.copy:
        dest: /etc/modules-load.d/waydroid.conf
        content: "binder_linux\n"
        owner: root
        group: root
        mode: '0644'
      become: yes

    - name: Load binder_linux kernel module
      community.general.modprobe:
        name: binder_linux
        state: present
      become: yes
      failed_when: false  # non-fatal: module file absent until linux-modules-extra is installed

    - name: Enable and start waydroid-container service
      ansible.builtin.systemd:
        name: waydroid-container
        enabled: yes
        state: started
        daemon_reload: yes
      become: yes
      failed_when: false  # non-fatal: service unit absent if hms hasn't run yet
